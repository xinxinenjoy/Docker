name: 115offline

# 改 115offline/ 下的东西才触发（monorepo 里一个项目一个 workflow）
on:
  push:
    branches: [main]
    paths:
      - '115offline/**'
      - '.github/workflows/115offline.yml'
  workflow_dispatch:

# 连推多个提交时只保留最新一次构建：旧的同 workflow run 会被自动取消，避免排队干等。
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ⚠️ 没有 QEMU / 没有多架构了（2026-10-05 红领巾拍板：只保留 x86-64）。
      #    runner 本身就是 amd64 ⇒ 构建是**原生**的，不再有模拟开销。
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: xinxinenjoy
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./115offline
          platforms: linux/amd64
          push: true
          # 发新版时在这里加/改 tag
          tags: |
            xinxinenjoy/115offline:latest
            xinxinenjoy/115offline:1.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 镜像推上去之后，把仓库里的 README 同步到 Hub 仓库页（短描述 + Overview）。
      # 规则见仓库根 README 的「维护者流程」—— 镜像更新了、说明还停在旧版 = 误导。
      # ⚠️ 用 PAT 走 /v2/users/login/ 换 JWT：PAT 【不能】当 Bearer 头用（会 401），
      #    但可以当 password 提交（2026-10-05 实测）。
      - name: Sync Docker Hub description
        env:
          DOCKERHUB_USERNAME: xinxinenjoy
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          HUB_REPO: 115offline
          # 🔴 2026-10-06 红领巾：「dockerhub 里不要写那么多东西，只写用法和功能介绍」
          #    ⇒ Hub 页面同步精简版 DOCKERHUB.md（只留功能 + 用法），README.md 留在仓库当完整文档。
          README_PATH: 115offline/DOCKERHUB.md
          SHORT_DESCRIPTION: 自托管 115 离线下载推送工具：网页粘贴磁力，一键推送
        run: python3 .github/scripts/sync-hub-description.py
