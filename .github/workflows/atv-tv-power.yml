name: atv-tv-power

on:
  push:
    branches: [main]
    paths:
      - 'atv-tv-power/**'
      - '.github/workflows/atv-tv-power.yml'
  workflow_dispatch:

# 连推多个提交时只保留最新一次构建：旧的同 workflow run 会被自动取消，避免排队干等。
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ⚠️ 没有 QEMU / 没有多架构了（2026-10-05 红领巾拍板：只保留 x86-64）。
      #    runner 本身就是 amd64 ⇒ 构建是**原生**的，不再有模拟开销；
      #    Dockerfile 里那段"非 amd64 装编译工具链"也随之不需要了。
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: xinxinenjoy
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./atv-tv-power
          platforms: linux/amd64
          push: true
          tags: |
            xinxinenjoy/atv-tv-power:latest
            xinxinenjoy/atv-tv-power:1.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 镜像推上去之后，把仓库里的 DOCKERHUB.md 同步到 Hub 仓库页（短描述 + Overview）。
      # 规则见仓库根 README 的「维护者流程」—— 镜像更新了、说明还停在旧版 = 误导。
      # ⚠️ Hub 页面只放「功能 + 用法」精简版，完整文档留在仓库 README.md。
      - name: Sync Docker Hub description
        env:
          DOCKERHUB_USERNAME: xinxinenjoy
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          HUB_REPO: atv-tv-power
          README_PATH: atv-tv-power/DOCKERHUB.md
          SHORT_DESCRIPTION: Apple TV 待机时自动关掉旁边那台电视
        run: python3 .github/scripts/sync-hub-description.py
