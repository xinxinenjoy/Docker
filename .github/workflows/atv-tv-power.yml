name: atv-tv-power

on:
  push:
    branches: [main]
    paths:
      - 'atv-tv-power/**'
      - '.github/workflows/atv-tv-power.yml'
  workflow_dispatch:

# 连推多个提交时只保留最新一次构建：旧的同 workflow run 会被自动取消，避免排队干等。
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: xinxinenjoy
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: ./atv-tv-power
          # ⚠️ 三个平台都要：amd64 = PC/NAS/云服务器，arm64 = 树莓派4/5+Apple Silicon，
          #    arm/v7 = 老树莓派3/32位ARM盒子。arm/v7 上 cffi/miniaudio 需现场编译，
          #    Dockerfile 已为该平台单独装工具链。
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            xinxinenjoy/atv-tv-power:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 镜像推上去之后，把仓库里的 README 同步到 Hub 仓库页（短描述 + Overview）。
      # 规则见仓库根 README 的「维护者流程」—— 镜像更新了、说明还停在旧版 = 误导。
      - name: Sync Docker Hub description
        env:
          DOCKERHUB_USERNAME: xinxinenjoy
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          HUB_REPO: atv-tv-power
          README_PATH: atv-tv-power/README.md
          SHORT_DESCRIPTION: Apple TV 待机时自动关掉旁边那台电视
        run: python3 .github/scripts/sync-hub-description.py
