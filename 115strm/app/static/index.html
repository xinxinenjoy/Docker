<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>115 STRM</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --line:#e6e8ee; --txt:#1c1f27; --dim:#78808f;
  --pri:#5b5bd6; --pri-d:#4a4ac0; --ok:#12a150; --warn:#d97706; --bad:#dc2626;
  --radius:12px; --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
/* ---------- 字体：2026-10-13 重调 ----------
   🔴 红领巾：「字体看着不清晰」。两条真病因，都是我这边的：
     ① `-webkit-font-smoothing:antialiased` —— 这是**给 macOS 写的**，
        Windows 上 Chrome 同属 Blink 也会吃它，副作用是中文笔画变细、发虚。
        本机是 Windows ⇒ 直接去掉，回到系统默认渲染（更实、更清楚）。
     ② 字体栈把 `-apple-system` / `Segoe UI` 排在中文前面 ——
        Windows 上拉丁字形用 Segoe UI、中文再往下落，中英混排时**两套字形基线不齐**，
        看着就是「一行字忽粗忽细」。⇒ 中文族提到最前（`Microsoft YaHei UI` 是
        Win10+ 的界面版，比 `Microsoft YaHei` 更收敛、小字号更清楚）。
   ⚠️ 别把 `-webkit-font-smoothing` 加回来 —— 它只在 macOS 上是对的。 */
body{
  font:14.5px/1.6 "Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Segoe UI",
       system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--txt);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--pri);text-decoration:none}

/* ---------- 布局：桌面侧栏 / 移动底部 tab ---------- */
.wrap{display:flex;flex-direction:column;min-height:100%}
header{
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  color:#fff;padding:18px 20px;
}
header h1{margin:0;font-size:17px;font-weight:650;letter-spacing:.2px}
header .sub{font-size:12px;opacity:.85;margin-top:3px}
header .chip{
  display:inline-flex;align-items:center;gap:6px;margin-top:10px;
  background:rgba(255,255,255,.18);border-radius:999px;padding:4px 11px;font-size:12px;
}
header .chip .dot{width:6px;height:6px;border-radius:50%;background:#4ade80}
header .chip.off .dot{background:#fca5a5}

main{flex:1;padding:16px;max-width:1080px;margin:0 auto;width:100%}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;
}
.card-h{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 16px;border-bottom:1px solid var(--line);
}
.card-h h2{margin:0;font-size:14.5px;font-weight:640;display:flex;align-items:center;gap:8px}
.card-h .hint{font-size:12.5px;color:var(--dim)}
.card-b{padding:16px}

/* ---------- 按钮 ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 15px;border-radius:9px;font-size:13px;font-weight:560;
  background:var(--card);border:1px solid var(--line);color:var(--txt);
  transition:.14s;white-space:nowrap;
}
.btn:hover{border-color:#c9cdd8;background:#fafbfc}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-d);border-color:var(--pri-d)}
.btn.good{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:#fff;border-color:#f0b4b4;color:var(--bad)}
.btn.bad:hover{background:#fef2f2;border-color:var(--bad)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn.ico{padding:7px 9px}

/* ---------- 统计格 ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.stat{background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.stat .k{font-size:12.5px;color:var(--dim);margin-bottom:3px}
.stat .v{font-size:21px;font-weight:660;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
/* 可点的统计格（「请求」那个数字）—— 提示它能展开明细，别让人猜 */
.stat.click{cursor:pointer;transition:.14s}
.stat.click:hover{border-color:#c9cdd8;background:#fff}
.stat.pri .v{color:var(--pri)}
.stat.warn .v{color:var(--warn)}
.stat.bad .v{color:var(--bad)}
.stat.ok .v{color:var(--ok)}

/* ---------- 表单 ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:13px}
/* 设置页的分组标题 —— 主表单与进阶区共用同一套，视觉上一家人 */
.grp{margin-bottom:19px}
.grp:last-child{margin-bottom:0}
.grp-h{font-size:12.5px;font-weight:650;color:#5b5bd6;margin-bottom:9px;
  display:flex;align-items:center;gap:8px}
.grp-h:after{content:"";flex:1;height:1px;background:var(--line)}
details.adv{margin-top:6px;border-top:1px dashed var(--line);padding-top:14px}
details.adv>summary{cursor:pointer;font-size:12.5px;font-weight:560;color:var(--dim);
  list-style:none;display:flex;align-items:center;gap:6px}
details.adv>summary::-webkit-details-marker{display:none}
details.adv>summary:before{content:"▸";font-size:11px;transition:.15s}
details.adv[open]>summary:before{transform:rotate(90deg)}
/* ⛔ **这条选择器绝对不能写成裸的 `.field label`** —— 2026-10-13 的坑就在这儿：
   `.switch` 本身也是个 `<label>`，而 `.field label`（特异性 0,1,1）**压过** `.switch`（0,1,0）
   ⇒ 开关的 `display:inline-flex` 被这里的 `display:block` 顶掉，`.track` 退化成行内元素、
   **宽度算成 0**，灰轨道根本画不出来；只剩 `::after` 那个白色圆点悬在「关」药丸上，
   看着就是个白圈（红领巾实拍报「开关显示异常」，且**全项目每个开关都中招**）。
   ⚠️ 以后只要在 `.field` 里再加任何基于 `<label>` 的组件，**必须一并排除在下面那条之外**。
   回归防线在 `tools/ui-shot-live.mjs`：「开关几何」那段会真去量 `.track` 的宽高。 */
.field label:not(.switch){display:block;font-size:12.5px;font-weight:560;margin-bottom:5px}
.field .desc{font-size:12.5px;color:var(--dim);margin-top:4px;line-height:1.45}
.field input[type=text],.field input[type=number],.field select{
  width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;
}
.field input:focus,.field select:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(91,91,214,.1)}
.field.env input,.field.env select{background:#fffbf0;border-color:#f0dcb4}
.tag{
  font-size:11px;padding:1px 7px;border-radius:5px;margin-left:6px;font-weight:560;
  background:#eef0f4;color:var(--dim);
}
.tag.env{background:#fef3c7;color:#92400e}
.tag.saved{background:#dbeafe;color:#1e40af}
/* ---------- 开关 ----------
   🔴 2026-10-08 **第二次重做**。第一次只把轨道染了色、右边加个小字，
      红领巾反馈「几处开关仍然不明显」—— 于是这次换成三条硬措施：
        ① 轨道做大（48×28），关闭态是**深灰**底 + 白点（对比度足够，不靠猜）
        ② 状态做成一枚**实心药丸**：开 = 深紫底白字 / 关 = 灰底深字
           ⇒ 不是「颜色深浅」，是**文字直接写出来**，色弱/偏色屏也读得出
        ③ 整个字段（`bool` 类）改成**整行**：左文右开关，并整行换底色
           ⇒ 扫一眼就知道哪几项是关着的
*/
.switch{display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none;flex:0 0 auto}
.switch input{position:absolute;width:1px;height:1px;opacity:0;margin:0}
.switch .track{
  width:48px;height:28px;border-radius:99px;background:#9ca3af;position:relative;
  transition:background .16s;flex:0 0 auto;box-shadow:inset 0 1px 3px rgba(0,0,0,.22);
}
.switch .track:after{
  content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
  background:#fff;transition:transform .16s;box-shadow:0 1px 3px rgba(0,0,0,.3);
}
.switch input:checked + .track{background:var(--pri)}
.switch input:checked + .track:after{transform:translateX(20px)}
.switch input:focus-visible + .track{box-shadow:0 0 0 3px rgba(91,91,214,.35)}
.switch .state{
  font-size:12.5px;font-weight:700;min-width:2.3em;text-align:center;
  padding:3px 8px;border-radius:6px;background:#e5e7eb;color:#374151;transition:.16s;
}
.switch input:checked ~ .state{background:#4338ca;color:#fff}

/* 布尔字段：整行左文右开关 */
.field.sw{grid-column:1/-1;display:flex;align-items:center;gap:16px;
  padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff}
.field.sw.on{border-color:#c7d2fe;background:#f7f7ff}
.field.sw .sw-txt{flex:1;min-width:0}
.field.sw .sw-txt .t{font-size:13.5px;font-weight:620;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.field.sw .sw-txt .d{font-size:12.5px;color:var(--dim);margin-top:3px;line-height:1.5}

/* ⛔ 这里原来有一整套 `.switchbox`（「只演练」那个醒目开关的三处表意：
   整块状态条 + 开/关文字 + 蓝/红配色）。`dry_run` 2026-10-11 删掉后
   **没有任何地方再用它** —— 一并清掉：留着一堆无人引用的选择器，
   下次改样式时会以为它还在起作用（本项目 2026-10-08 就为「看不出开是关」
   在它上面返过一次工，别再把它当活的）。 */

/* ---------- 动作区 ---------- */
.actions{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.seg{display:inline-flex;background:#f1f2f6;border-radius:9px;padding:3px;gap:2px}
.seg button{padding:7px 13px;border-radius:7px;font-size:13px;font-weight:560;color:var(--dim);transition:.14s}
.seg button.on{background:#fff;color:var(--txt);box-shadow:var(--shadow)}

/* ---------- 日志 ---------- */
.log{
  background:#1a1d24;color:#c9d1d9;border-radius:10px;padding:12px;
  font:12.5px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  max-height:340px;overflow-y:auto;
}
.log div{white-space:pre-wrap;word-break:break-all}
.log .t{color:#6b7280;margin-right:7px}
.log .info{color:#c9d1d9}
.log .warning{color:#fbbf24}
.log .error{color:#f87171}

/* ---------- 进度条 ---------- */
.bar{height:4px;background:#eceef2;border-radius:99px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#6366f1,#8b5cf6);width:30%;border-radius:99px;animation:mv 1.4s ease-in-out infinite}
@keyframes mv{0%{margin-left:-30%}100%{margin-left:100%}}

/* ---------- 列表 ---------- */
.list{max-height:400px;overflow-y:auto;border:1px solid var(--line);border-radius:9px}
.row{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid #f2f3f6;font-size:13px}
.row:last-child{border-bottom:none}
.row .p{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,monospace}
.row .u{color:var(--dim);font-size:12.5px;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:11px;padding:1px 7px;border-radius:5px;font-weight:560;flex:0 0 auto}
.badge.add{background:#dcfce7;color:#166534}
.badge.upd{background:#dbeafe;color:#1e40af}
.badge.del{background:#fee2e2;color:#991b1b}
/* 「配不上的字幕」那块是按**目录**分组的（2026-10-11 红领巾：光给文件名不知道去哪儿处理）
   ⇒ 目录那行用个中性徽标，跟「新增/更新/删除」的彩色徽标区分开。 */
.badge.dir{background:#f1f5f9;color:#475569}

/* ---------- 差异预览：两行式 ----------
   ⚠️ 原来是一行里「路径 + URL」并排，长路径会把 URL 挤成一小条灰字、两边都读不了。
      改成**两行**：第一行路径（加粗、可换行），第二行 URL（小字、可换行、缩进对齐）。
      这样「这条到底指向哪」一眼能看清，也是预览卡存在的意义。 */
.diff{max-height:420px;overflow-y:auto;border:1px solid var(--line);border-radius:9px}
.diff .it{padding:9px 12px;border-bottom:1px solid #f2f3f6}
.diff .it:last-child{border-bottom:none}
.diff .it .l1{display:flex;gap:8px;align-items:baseline}
.diff .it .p{flex:1;min-width:0;font-family:ui-monospace,monospace;font-size:12.5px;
  word-break:break-all;line-height:1.45}
.diff .it .u{margin-top:3px;padding-left:26px;color:var(--dim);font-size:12px;
  font-family:ui-monospace,monospace;word-break:break-all;line-height:1.5}
.diff .it .u b{color:#16a34a;font-weight:560}
.diff .it.was .u b{color:#dc2626}

/* ---------- 提示条 ---------- */
.note{
  display:flex;gap:9px;align-items:flex-start;padding:11px 13px;border-radius:9px;
  font-size:13px;line-height:1.6;margin-bottom:12px;
}
.note i{font-style:normal;flex:0 0 auto;font-size:14px;line-height:1.3}
.note.warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e}
.note.info{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af}
.note.bad{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
.note.ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534}

/* ---------- 移动端 ---------- */
nav{
  display:flex;background:var(--card);border-top:1px solid var(--line);
  position:sticky;bottom:0;z-index:10;
}
nav button{
  flex:1;padding:10px 4px;font-size:12.5px;color:var(--dim);
  display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:560;
}
nav button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--pri)}
.page{display:none}
.page.on{display:block}
@media(min-width:900px){
  nav{position:static;border-top:none;border-bottom:1px solid var(--line);padding:0 16px;background:transparent}
  nav button{flex:0 0 auto;flex-direction:row;gap:7px;padding:12px 16px;border-bottom:2px solid transparent}
  nav button.on{border-bottom-color:var(--pri)}
}
.muted{color:var(--dim)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* ---------- 步骤清单：「这一轮会做什么」 ----------
   ⚠️ 条目**内容**来自后端 `pipeline.SYNC_STEPS`（单一事实源），
      这里只管样子 —— 改文案请改后端，别在前端另抄一份（两处必然分叉）。 */
.steps{margin:0;padding:0;list-style:none;counter-reset:st}
.steps li{display:flex;gap:9px;padding:7px 0;align-items:flex-start;
  border-bottom:1px dashed var(--line)}
.steps li:last-child{border-bottom:none;padding-bottom:0}
.steps li::before{counter-increment:st;content:counter(st);flex:0 0 20px;height:20px;
  border-radius:50%;background:#eef0ff;color:var(--pri);font-size:11px;font-weight:650;
  display:flex;align-items:center;justify-content:center;margin-top:1px}
.steps .t{display:block;font-size:13.5px;font-weight:600}
.steps .h{display:block;font-size:12.5px;color:var(--dim);line-height:1.55;margin-top:2px}
.right{margin-left:auto}
.hidden{display:none!important}

/* ---------- 结果区：分块 ----------
   🔴 2026-10-13 新增。红领巾：「最好不止是这样描述出来，而是分块显示——
      字幕、目录、视频、同步结果之类的、结构清晰一些」。

   原来整块结果是**一次 innerHTML 平铺**：目录几行、字幕几行、两个黄框，
   全都一个字号一个底色，读的人得自己找哪句跟哪句是一伙的。
   现在每种信息各占一个 `.sec`：标题行（图标 + 名字 + 关键计数）+ 可折叠正文。
   ⭐ 折叠状态由 `data-fold` 记在 DOM 上，重渲染时**按标题名找回**（见 `secHtml()`），
      否则一刷新就把用户展开的那块又收回去 —— 那正是「老是重置」体感的一半。 */
/* 🔴 2026-10-13 二改。红领巾：「这几个条目的折叠、鼠标效果太不明显了，根本分不清
   是不是展开了，以及有没有内容也不清楚。」
   一改（同日早些）只做到「**能**折」，但**折与不折长得几乎一样**：旧写法仅在折叠时把
   `▾` 转 -90°、去掉标题底边线 —— 而那个 `▾` 只有 11px、颜色 `#9aa1ae` 是浅灰，
   站在半米外根本分不出哪块开着。⇒ 判据改成**三条一眼可验证的差异**：
     ① 左侧 3px 立条：展开 = 主色实心，折叠 = 熄灭（最显眼的一条）
     ② 标题底色：展开 = 白，折叠 = 灰（warn/bad 的语义底色保留，只压深一档）
     ③ 右侧**常驻**状态签：折叠 = 「展开」，展开 = 「收起」
        ⛔ 不再像旧写法那样只在个别块上挂一句「点标题展开/收起」——
           一块有一块没有，反而让人怀疑没挂字的那块是不是不能点。
   另补「有没有内容」：空块整行压灰、状态签写「空」（见 `.sec.empty`）。 */
.sec{border:1px solid var(--line);border-radius:10px;margin-bottom:11px;
  overflow:hidden;background:#fff}
.sec:last-child{margin-bottom:0}
.sec-h{position:relative;display:flex;align-items:center;gap:9px;
  padding:10px 13px 10px 16px;background:#fff;border-bottom:1px solid var(--line);
  cursor:pointer;user-select:none;transition:background .12s}
/* ① 左侧立条 —— 折叠态熄灭，这是「开没开」最远也看得见的那条 */
.sec-h::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--pri);transition:background .12s}
.sec-h:hover{background:#f2f5ff}
.sec-h:active{background:#e9eefe}
.sec-h .car{flex:0 0 auto;width:16px;height:16px;color:#5b6472;
  display:flex;align-items:center;justify-content:center;transition:transform .15s}
.sec-h .car svg{width:13px;height:13px;display:block}
.sec-h:hover .car{color:var(--pri)}
.sec-h .tt{font-size:13.5px;font-weight:640;display:flex;align-items:center;gap:7px}
.sec-h .sum{font-size:12.5px;color:var(--dim);font-weight:500}
/* ③ 常驻状态签（旧写法是「有就显示、没有就不显示」，那正是混乱的来源） */
.sec-h .sp{margin-left:auto;flex:0 0 auto;font-size:12px;color:var(--dim);
  border:1px solid var(--line);border-radius:999px;padding:1px 9px;
  transition:color .12s,border-color .12s}
.sec-h:hover .sp{color:var(--pri);border-color:var(--pri)}
.sec-b{padding:13px}
/* ② 折叠态：三条差异同时生效 —— 立条熄灭、标题变灰、正文收起、箭头朝右 */
.sec.fold>.sec-h{background:#f2f4f7;border-bottom-color:transparent}
.sec.fold>.sec-h::before{background:transparent}
.sec.fold>.sec-h:hover{background:#eaeef4}
.sec.fold>.sec-b{display:none}
.sec.fold>.sec-h .car{transform:rotate(-90deg)}
/* 标题行按语义上色 —— 一眼扫过去先认出「哪块是坏的」。
   ⚠️ 这几条**必须排在折叠规则之后**：否则 `.sec.warn>.sec-h` 会把折叠态的灰底盖掉，
      又变回「折了跟没折一样」。`.fold` 变体单独给一档更深的色，语义和状态都不丢。 */
.sec.warn>.sec-h{background:#fffbeb}
.sec.warn>.sec-h:hover{background:#fdf3d8}
.sec.warn>.sec-h::before{background:#d97706}
.sec.warn.fold>.sec-h{background:#fdf6e3}
.sec.bad>.sec-h{background:#fef2f2}
.sec.bad>.sec-h:hover{background:#fbe4e4}
.sec.bad>.sec-h::before{background:#dc2626}
.sec.bad.fold>.sec-h{background:#fbe9e9}
/* 空块：整行压灰（立条熄灭）+ 状态签「空」⇒「有没有内容」不用点开就知道 */
.sec.empty>.sec-h .tt,.sec.empty>.sec-h .sum{color:#9aa1ae}
.sec.empty>.sec-h .car{color:#b6bcc6}
.sec.empty>.sec-h::before{background:transparent}
.sec.empty>.sec-h:hover .sp{color:var(--dim);border-color:var(--line)}

/* ---------- 小表（请求明细 / 耗时拆分）---------- */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-weight:620;color:var(--dim);padding:6px 9px;
  border-bottom:1px solid var(--line);white-space:nowrap;font-size:12.5px}
.tbl td{padding:6px 9px;border-bottom:1px solid #f2f3f6;vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl td.num,.tbl th.num{text-align:right;white-space:nowrap;
  font-family:ui-monospace,monospace;font-variant-numeric:tabular-nums}
.tbl .mono{font-family:ui-monospace,monospace}
.tbl tr.badness td{color:#b91c1c}
/* 明细表滚动区：给它自己的滚动条，跟页面滚动互不干扰 */
.reqbox{max-height:380px;overflow:auto;border:1px solid var(--line);border-radius:9px}

/* ---------- 目录选择器（同步范围）---------- */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:12.5px;margin-bottom:11px}
.crumbs button{padding:3px 7px;border-radius:6px;color:var(--pri);font-weight:560}
.crumbs button:hover{background:#eef0ff}
.crumbs .sep{color:#c3c8d2}
.crumbs .cur{color:var(--txt);font-weight:650;padding:3px 7px}

.picked{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:32px;
  padding:8px 10px;border:1px dashed #cfd4de;border-radius:9px;background:#fafbfc}
.picked .empty{font-size:12px;color:var(--dim)}
.chip{display:inline-flex;align-items:center;gap:6px;background:#eef0ff;color:#3f3fb8;
  border-radius:7px;padding:4px 6px 4px 9px;font-size:12px;font-weight:560;
  font-family:ui-monospace,monospace;max-width:100%}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{color:#7077c9;font-size:14px;line-height:1;padding:0 2px;border-radius:4px}
.chip button:hover{color:#dc2626}
.picked .all{font-size:12px;color:var(--dim);font-style:italic}

.picker{border:1px solid var(--line);border-radius:9px;max-height:280px;overflow-y:auto}
.pick{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid #f2f3f6}
.pick:last-child{border-bottom:none}
.pick:hover{background:#fafbfc}
.pick input{width:16px;height:16px;flex:0 0 auto;accent-color:var(--pri);cursor:pointer}
.pick .nm{flex:1;min-width:0;font-size:13px;cursor:pointer;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.pick .nm:hover{color:var(--pri);text-decoration:underline}
.pick .meta{font-size:12.5px;color:var(--dim);flex:0 0 auto;font-variant-numeric:tabular-nums}
.pick .go{font-size:12.5px;color:var(--pri);flex:0 0 auto;padding:2px 7px;border-radius:6px}
.pick .go:hover{background:#eef0ff}
.pick.on{background:#f7f7ff}
.toast{
  position:fixed;left:50%;bottom:76px;transform:translateX(-50%);
  background:#1f2330;color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;
  box-shadow:0 8px 24px rgba(0,0,0,.22);z-index:99;opacity:0;transition:.24s;pointer-events:none;
}
.toast.on{opacity:1;bottom:86px}

/* ---------- 多行字段（Webhook 的 BODY / HEADERS 是「每行一条 key: value」）---------- */
.grid textarea{
  width:100%;box-sizing:border-box;font-size:12.5px;line-height:1.55;padding:8px 10px;
  border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--txt);
  resize:vertical;font-family:ui-monospace,Consolas,"Courier New",monospace;
}
.grid textarea:focus{outline:none;border-color:#a5b4fc;box-shadow:0 0 0 3px rgba(99,102,241,.12)}

/* ---------- 设置页：未保存提示条（改完忘了点保存是常态）---------- */
.savebar{
  position:sticky;bottom:14px;z-index:8;display:none;align-items:center;gap:10px;
  margin-top:6px;padding:11px 14px;border-radius:12px;
  background:#1f2937;color:#fff;box-shadow:0 10px 26px rgba(16,24,40,.28);
}
.savebar.on{display:flex}
.savebar span{flex:1;font-size:12.5px;font-weight:560}
.savebar .btn{background:#374151;border-color:#4b5563;color:#e5e7eb}
.savebar .btn:hover{background:#4b5563;border-color:#6b7280}
.savebar .btn.pri{background:#fff;border-color:#fff;color:#4338ca}
.savebar .btn.pri:hover{background:#eef0ff;border-color:#eef0ff}

/* ---------- 设置页：首次配置清单 ----------
   ⚠️ 条目的**序号**与下方三张卡的序号徽章（`.cno`）是同一套编号 ——
      两处对不上比没有序号更糟，改一处必须改另一处。 */
.setup{display:grid;gap:9px}
.setup .step{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:10px;
  border:1px solid var(--line);background:#fff;font-size:12.8px}
.setup .step.todo{border-color:#fcd34d;background:#fffbeb}
.setup .step.done{color:var(--dim)}
/* 「还没轮到」：条件没到位（如还没目录树）—— 虚线降级，但**正文不淡化**，
   因为这里装的正是「先去干 X」的引导文案。 */
.setup .step.locked{background:#fafbfc;border-style:dashed}
.setup .step .tick{flex:0 0 auto;width:22px;height:22px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;
  background:#e5e7eb;color:#6b7280}
.setup .step.done .tick{background:#dcfce7;color:#15803d}
.setup .step.todo .tick{background:#fde68a;color:#92400e}
.setup .step.locked .tick{background:#e5e7eb;color:#8b93a1}
.setup .step .body{flex:1;min-width:0}
.setup .step .t{font-weight:620}
.setup .step .h{font-size:12.5px;color:var(--dim);margin-top:2px;line-height:1.5}
.setup .step .go{margin-left:auto;flex:0 0 auto}

/* ---------- 设置页：卡片序号徽章 ----------
   序号 = 引导顺序（账号 → 播放地址 → 同步范围），颜色即状态：
   琥珀 = 还差你一步 / 绿勾 = 已完成 / 灰 = 还没轮到。 */
.cno{flex:0 0 auto;width:21px;height:21px;border-radius:50%;display:inline-flex;
  align-items:center;justify-content:center;font-size:12.5px;font-weight:700;
  background:#eef0ff;color:var(--pri)}
.cno.todo{background:#fde68a;color:#92400e}
.cno.done{background:#dcfce7;color:#15803d}
.cno.lock{background:#e5e7eb;color:#8b93a1}
/* 条件不足的卡片：虚线边框 + 灰表头 —— ⚠️ 只降表头，**不淡化正文**
   （卡里装的恰恰是「先去干 X」的引导文案，淡化了就读不清）。 */
.card.locked{border-style:dashed}
.card.locked .card-h{background:#fafbfc}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>115 STRM</h1>
    <div class="sub">把 115 网盘结构镜像成本地 strm，给媒体服务器扫描</div>
    <div class="chip" id="chip"><span class="dot"></span><span id="chipTxt">检查中…</span></div>
  </header>

  <!--
    🔴 2026-10-11 合并页签（红领巾：「概览和同步、记录整合一下应该更好吧」）：
       原来 概览 / 同步 / 设置 / 记录 四个页签，前三个其实是**同一条时间线的三段**
       （现状 → 这一轮 → 历史），拆开等于把「看数据」这个动作切碎；
       而且 `goPage()` 里切页签各触发不同重载，更容易看到旧数据。
       ⇒ 现在只剩 **同步** 和 **设置** 两个。设置独立，因为它低频、且写配置。

       ⚠️ 页内**顺序不能乱**：现状 → 待确认删除 → 开始一轮 → 差异预览 →
          这一轮结果 → 日志 → 运行记录。结果区**只有一个**，
          点历史某一行 = 把那一轮填进同一个结果区（顶部给「← 回到最近一轮」）。
  -->
  <nav id="nav">
    <button data-p="sync" class="on">
      <svg viewBox="0 0 24 24"><path d="M5 3l14 9-14 9V3z"/></svg>同步</button>
    <button data-p="set">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15a1.7 1.7 0 0 0-1.6-1H1.3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 3 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 7 4.6h.1A1.7 1.7 0 0 0 8.1 3V2.9a2 2 0 1 1 4 0V3a1.7 1.7 0 0 0 2.9 1.2 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 19.4 9v.1a1.7 1.7 0 0 0 1.6 1h.1a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.6 1z"/></svg>设置</button>
    <!-- 🔴 2026-10-13 新增「推送」（红领巾：「需要再增加一个『推送』模块，用于配置推送的渠道」）。
         独立成页、不并进设置页：推送是**低频且独立**的关切（渠道 + 测试按钮），
         与「设置」那堆跑批参数不同源。⚠️ 这不是 10-11 那次「把同一条时间线拆碎」——
         推送本来就不在「现状 → 这一轮 → 历史」那条线里。 -->
    <button data-p="push">
      <svg viewBox="0 0 24 24"><path d="M18 16.5v-5.5a6 6 0 1 0-12 0v5.5L4.4 19h15.2L18 16.5z"/><path d="M10 21.5h4"/></svg>推送</button>
  </nav>

  <main>
    <!-- ======================= 同步（现状 + 执行 + 结果 + 日志 + 记录） ======================= -->
    <section class="page on" id="p-sync">
      <div id="homeNotes"></div>

      <div class="card">
        <div class="card-h"><h2>现状</h2><span class="hint" id="homeAt"></span></div>
        <div class="card-b">
          <div class="stats" id="homeStats"></div>
        </div>
      </div>

      <div class="card" id="pendingCard" style="display:none">
        <div class="card-h">
          <h2>待确认删除</h2>
          <span class="hint" id="pendingHint"></span>
        </div>
        <div class="card-b">
          <!-- ⚠️ 这段是**为什么没自动删**。⚠️ 2026-10-20 起这张卡只在这两种情况出现：
               异常闸门触发 / 变动面过大 ⇒ 不写清原因，他就只能看到一长串路径瞎猜。 -->
          <div class="muted" id="pendingWhy" style="margin-bottom:11px;line-height:1.7"></div>
          <div class="actions">
            <button class="btn bad sm" onclick="applyPending()">确认删除</button>
            <button class="btn sm" onclick="cancelPending()">取消</button>
          </div>
          <div class="list" id="pendingList" style="margin-top:11px"></div>
        </div>
      </div>

      <!--
        🔴 2026-10-08：「数据来源」选择器整个删掉（只有一条路，摆个选择器是误导），
           换成这张说清「这一轮会做什么」的卡 —— 步骤由后端 `SYNC_STEPS` 提供。
        🔴 2026-10-11：「执行」卡并进来，标题改「开始一轮」。
      -->
      <div class="card">
        <div class="card-h">
          <h2>开始一轮</h2>
          <span class="hint">工具自己导目录树，你不用手动导</span>
        </div>
        <div class="card-b">
          <!-- ⭐ **六步说明默认收着**（2026-10-13 二改）。
               红领巾：「主页这一部分占据的篇幅太长了，做成一个鼠标放上去会弹出来的提示，
               或者默认折叠，点击查看的那种」。
               选**默认折叠**而不是悬浮提示：本页面有移动端底部 tab 布局，悬浮在触屏上用不了；
               而且折叠是本页已成立的模式（「运行记录」卡就是这么做的），不必另发明一套。
               ⚠️ 按钮（预览差异 / 立即执行 / 停止）**留在折叠外面** —— 它们是这一屏的主操作，
                  收进去等于把主操作藏了。
               ⚠️ 六步的**文案**仍来自后端 `pipeline.SYNC_STEPS`，这里只管样子。 -->
          <div class="sec fold" id="stepBox" data-k="steps">
            <div class="sec-h" role="button" tabindex="0" aria-expanded="false"
                 onclick="toggleSec('steps')" onkeydown="secKey(event,'steps')">
              <span class="car"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
              <span class="tt">这一轮会做什么</span>
              <span class="sum" id="stepSum"></span>
              <span class="sp">展开</span>
            </div>
            <div class="sec-b"><ol class="steps" id="stepList"></ol></div>
          </div>
          <div id="runGuard" style="margin-top:13px"></div>
          <div class="actions" style="margin-top:13px">
            <button class="btn" onclick="preview()">预览差异</button>
            <button class="btn pri" id="btnRun" onclick="run()">立即执行</button>
            <button class="btn bad sm" id="btnStop" onclick="stop()" style="display:none">停止</button>
          </div>
          <div class="bar hidden" id="runBar"><i></i></div>
          <div class="stats" id="runStats" style="margin-top:13px;display:none"></div>
        </div>
      </div>

      <div class="card hidden" id="prevCard">
        <div class="card-h"><h2>差异预览</h2><span class="hint" id="prevHint"></span></div>
        <div class="card-b">
          <div class="stats" id="prevStats" style="margin-bottom:13px"></div>
          <div class="seg" id="prevSeg" style="margin-bottom:11px">
            <button data-t="add" class="on">新增</button>
            <button data-t="update">更新</button>
            <button data-t="delete">删除</button>
            <button data-t="renamed">已改名</button>
          </div>
          <div class="diff" id="prevList"></div>
          <div class="muted" style="font-size:12.5px;margin-top:9px;word-break:break-all" id="prevMore"></div>
        </div>
      </div>

      <!--
        ⭐ **结果区只有一个** —— 「最近一轮」和「点历史某一行」都填这里。
           ⛔ 不要为历史另开一块：那样同一种信息会有两处渲染，必然跑偏。
      -->
      <div class="card" id="resultCard">
        <div class="card-h">
          <h2 id="resultTitle">这一轮结果</h2>
          <span class="hint" id="lastAt"></span>
          <button class="btn sm hidden" id="resultBack" onclick="showLatest()">← 回到最近一轮</button>
        </div>
        <div class="card-b"><div id="lastRun" class="muted">还没有跑过</div></div>
      </div>

      <div class="card">
        <div class="card-h"><h2>日志</h2><span class="hint" id="logHint"></span></div>
        <!-- ⚠️ 占位句别删：日志只活在内存里（刷新就没了），空着一个黑条会让人以为坏了。
             `run()` 开头会 `innerHTML = ''` 把它清掉，不影响正式输出。 -->
        <div class="card-b"><div class="log" id="log">
          <div class="muted" style="color:#6b7280">点「立即执行」后，这里会实时滚动显示每一步。</div>
        </div></div>
      </div>

      <!-- 折叠着放最后 —— 默认不展开，避免一进来就见 60 行列表 -->
      <div class="card">
        <div class="card-h">
          <h2>运行记录</h2>
          <span class="hint" id="histHint">最近 60 次 · 点一行看那一轮处理了什么</span>
          <button class="btn sm" id="btnHist" onclick="toggleHist()">展开</button>
        </div>
        <div class="card-b hidden" id="histBody">
          <div class="list" id="histList"></div>
        </div>
      </div>
    </section>

    <!-- ======================= 设置 ======================= -->
    <!--
      🔴 2026-10-08 重排（红领巾：「布局清晰一点」「去掉一些不必要的设置」）：
         顺序 = **照着第一次配置的顺序走** —— 账号 → 范围 → 输出 → 参数。
         上一版是「范围 / 参数 / 账号」跳着排，而且所有参数（含十几项进阶的）
         全塞在一张卡里，找不到重点。
         现在：第一屏只留「必须你决定的」，其余全部折进「进阶参数」。

      🔴 2026-10-09 又改了一次顺序（红领巾定「引导顺序 A」）：
         「同步范围」与「播放地址」**对调** ⇒ 卡片顺序变成
         **① 115 账号 → ② 播放地址 → ③ 同步范围 → 参数**。
         为什么必须换：顶部清单要求「先填播放地址（唯一必填项）」，
         而卡片却把「同步范围」摆在它前面 —— 两处顺序打架，新用户照哪边走都别扭。
         ⚠️ 三张卡的序号徽章（`.cno`）与顶部清单的编号**是同一套**，改顺序必须同步改。
    -->
    <section class="page" id="p-set">

      <!-- 首次配置清单（JS 渲染；都齐了就自动收起） -->
      <div id="setupCard"></div>

      <div class="card" id="acctCard">
        <div class="card-h">
          <h2><span class="cno todo" id="cnoAcct">1</span>115 账号</h2>
          <div class="actions">
            <button class="btn sm" onclick="loadAcct()">刷新</button>
            <button class="btn sm" onclick="showQr()">扫码登录</button>
            <button class="btn pri sm" onclick="showPaste()">粘贴 cookie 添加</button>
          </div>
        </div>
        <div class="card-b">
          <div id="acctForm"></div>
          <div id="acctBody"></div>
        </div>
      </div>

      <!-- ⭐ 单独一张卡：这是唯一「必须填」的参数，且它现在只存在 data/config.json -->
      <div class="card" id="outCard">
        <div class="card-h">
          <h2><span class="cno todo" id="cnoPrefix">2</span>播放地址</h2>
          <span class="hint" id="outHint"></span>
        </div>
        <div class="card-b">
          <div id="outBody"></div>
          <div class="actions" style="margin-top:13px">
            <button class="btn sm" onclick="checkPrefix()">自检 strm 前缀</button>
            <button class="btn sm" onclick="detectAlist()">探测 Alist 挂载</button>
          </div>
          <div id="checkOut" style="margin-top:11px"></div>
        </div>
      </div>

      <div class="card" id="scopeCard">
        <div class="card-h">
          <h2><span class="cno lock" id="cnoScope">3</span>同步范围</h2>
          <div class="actions">
            <button class="btn sm" onclick="loadScope()">重新读取</button>
            <button class="btn pri sm" id="btnSaveScope" onclick="saveScope()">保存范围</button>
          </div>
        </div>
        <div class="card-b">
          <div id="scopeOut"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-h">
          <h2>参数</h2>
          <span class="hint">默认值就是稳态，不动也能跑</span>
        </div>
        <div class="card-b">
          <div id="setBody"></div>
        </div>
      </div>

      <!-- 有未保存改动时才浮出来（省得改完忘了点保存） -->
      <div class="savebar" id="saveBar">
        <span id="saveMsg">有未保存的改动</span>
        <button class="btn sm" onclick="loadSettings()">放弃</button>
        <button class="btn pri" onclick="saveSettings()">保存</button>
      </div>
    </section>

    <!-- ======================= 推送 =======================
         内容（总开关 + 发送渠道下拉 + 选中渠道的参数）由 `renderPush()` 用后端
         `settings.py` 的「推送」组生成 —— ⛔ 不在 HTML 里抄一份字段名，
         那样后端加/改字段时两边必然分叉。 -->
    <section class="page" id="p-push">
      <div class="card">
        <div class="card-h">
          <h2>推送</h2>
          <span class="hint" id="pushHint"></span>
        </div>
        <div class="card-b">
          <div id="pushNote"></div>
          <div id="pushBody"></div>
        </div>
      </div>
      <div class="savebar" id="pushSaveBar">
        <span id="pushSaveMsg">有未保存的改动</span>
        <button class="btn sm" onclick="loadSettings()">放弃</button>
        <button class="btn pri" onclick="saveSettings()">保存</button>
      </div>
    </section>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const TOKEN = localStorage.getItem('token') || '';
let PREV = null, LOGSEQ = 0, TIMER = null;
// 前缀配了没 —— 空着时同步页要先给一句人话，别等点了才报错
let PREFIX_READY = true;

/* ---------------- 基础 ---------------- */
async function api(path, opt = {}) {
  const h = { 'Content-Type': 'application/json' };
  if (TOKEN) h['Authorization'] = 'Bearer ' + TOKEN;
  const r = await fetch(path, { ...opt, headers: h });
  if (r.status === 401) {
    const t = prompt('访问口令');
    if (t) { localStorage.setItem('token', t); location.reload(); }
    throw new Error('需要口令');
  }
  if (!r.ok) {
    let msg = r.statusText;
    try { const j = await r.json(); msg = j.detail || j.message || msg; } catch (e) {}
    throw new Error(msg);
  }
  return r.json();
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), 2200);
}
const n = v => (v == null ? '0' : Number(v).toLocaleString());

/* ---------------- 导航 ----------------
   ⚠️ 抽成 `goPage()` 是因为「首次配置清单」里的按钮也要跳页/跳卡 ——
      复制一份切换逻辑出来必然分叉（迟早一边改了另一边没改）。 */
function goPage(p) {
  $$('#nav button').forEach(x => x.classList.toggle('on', x.dataset.p === p));
  $$('.page').forEach(x => x.classList.toggle('on', x.id === 'p-' + p));
  // ⚠️ 页签 `sync` / `set` / `push`。`set` 与 `push` 吃的是**同一份** `/api/settings`
  //    （推送字段只是同一个 `FIELDS` 表里的另一组），所以都走 `loadSettings()`。
  if (p === 'set') { loadScope(); loadSettings(); loadAcct(); }
  if (p === 'push') { loadSettings(); }
  window.scrollTo(0, 0);
}
/* 清单里的「去 X →」：目标在本页就**只滚过去不重载** ——
   重载会把正在填的播放地址冲掉，那比不跳更烦人。 */
function gotoStep(page, anchor) {
  if (page !== 'set') { goPage(page); return; }
  if (!$('#p-set').classList.contains('on')) goPage('set');
  const el = anchor ? document.getElementById(anchor) : null;
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
$$('#nav button').forEach(b => b.onclick = () => goPage(b.dataset.p));

/* ---------------- 概览 ---------------- */
async function loadState() {
  let s;
  try { s = await api('/api/state'); }
  catch (e) { $('#chipTxt').textContent = '连不上服务'; $('#chip').classList.add('off'); return; }

  const okCookie = s.cookie && s.cookie.ok;
  $('#chip').classList.toggle('off', !okCookie);
  $('#chipTxt').textContent = okCookie ? `账号已就绪 · ${s.cookie.tail}` : '未配置 115 账号';
  $('#homeAt').textContent = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

  // 提示条
  const notes = [];
  const sc = (s.scope && s.scope.includes) || [];
  prefix_warn_from_state = s.prefix_warn || '';
  if (!okCookie) notes.push(['bad', '⚠', '还没配置 115 账号 —— 去设置页填账号文件，或在账号文件里登录一次。']);
  // 🔴 前缀为空是**阻断性**问题（跑不了），排在最前面、用最重的样式。
  //    它出厂就是空的（网页专属字段，见 config.strm_prefix）⇒ 首次用一定会遇到。
  if (s.prefix_ready === false) notes.push(['bad', '🔴',
    '还没配 <b>strm 内容前缀</b> —— 现在跑不了（生成的 strm 里会是残缺地址）。'
    + ' 去「设置 › 播放地址」填上你的 alist 地址，再点「自检 strm 前缀」验一下。']);
  if (s.prefix_warn) notes.push(['warn', '🔗', s.prefix_warn + ' <span class="mono">去设置页点「自检 strm 前缀」</span>']);
  if (!sc.length) notes.push(['info', '📂', '还没限定同步范围 —— 同步根下的<b>全部</b>目录都会处理。去「设置 › 同步范围」勾选要处理的目录。']);
  // ⛔ **不再提示「没有本地目录树」** —— 工具每一轮都会自己导一份，
  //    本地暂时没有 txt 是**正常**的（旧版那条提示是给「本地目录树」模式用的，已删）。
  if (!s.output_exists) notes.push(['warn', '📁', `输出目录还不存在：<span class="mono">${s.output_dir}</span> —— 第一次同步会自动建。`]);
  // ⚠️ 内容没变就别动 DOM —— 这两个盒子一多一少会改变文档高度，
  //    页面滚动位置跟着漂（见 `captureScroll` 的说明）。
  const notesHtml = notes.map(([c, i, t]) =>
    `<div class="note ${c}"><i>${i}</i><div>${t}</div></div>`).join('');
  if ($('#homeNotes').innerHTML !== notesHtml) $('#homeNotes').innerHTML = notesHtml;
  // 设置页的「首次配置」清单也吃这份状态（配对告警、账号就绪、跑没跑过）
  // ⚠️ `window.__state` 必须先落位 —— renderSetup 要读 `run` 判断「跑过第一轮没」。
  window.__state = s;
  if (SETUP_D) renderSetup();

  // 同步页的执行区：前缀没配时先把话说明白，别等点了才报错
  PREFIX_READY = s.prefix_ready !== false;
  const guard = $('#runGuard');
  if (guard) {
    guard.innerHTML = PREFIX_READY ? '' : `<div class="note bad" style="margin-bottom:12px"><i>🔴</i><div>
      <b>还没配 strm 内容前缀</b> —— 空着跑不了。去「设置 › 播放地址」填 alist 地址
      （<span class="mono">https://域名:端口/d/挂载路径</span>，必须用
      <span class="mono">/d</span> 端点）。</div></div>`;
  }

  // 「方式」**恒为一条**（旧版这里按模式显示三态，模式删掉后就没得选了）。
  // ⚠️ 不显示「本地目录树存在与否」—— 那是实现细节，用户不需要看。
  const homeHtml = [
    ['同步根', s.scope && s.scope.remote_root ? s.scope.remote_root : '（树根）', ''],
    ['只处理', sc ? (sc.length > 2 ? `${sc.length} 个目录` : sc.join(' · ')) : '全部', sc ? 'pri' : ''],
    ['方式', '自己导目录树', 'ok'],
    // ⚠️ 2026-10-20：这一格原来是「删除等待 10 分」（等够时间、**再等下一轮**才真删）。
    //    红领巾实测挂起清单躺 127 分钟没人处理 ⇒ 改成当轮复核即删，没有可等的分钟数了。
    ['删除判定', '当轮复核即删', 'ok'],
  ].map(([k, v, cls]) => `<div class="stat ${cls}">
    <div class="k">${k}</div>
    <div class="v" style="font-size:15px" title="${esc(String(v))}">${esc(String(v))}</div></div>`).join('');
  if ($('#homeStats').innerHTML !== homeHtml) $('#homeStats').innerHTML = homeHtml;

  // 待确认删除 —— ⚠️ 2026-10-20 起**只有两种情况**才会出现：
  //    异常闸门触发（消失比例过高）/ 变动面过大（候选散在几十个目录里）。
  //    正常删除当轮就做完了，这张卡平时是隐藏的。
  const p = s.pending || {};
  if (p.count) {
    $('#pendingCard').style.display = '';
    $('#pendingHint').textContent =
      `${n(p.count)} 条 · 发现于 ${p.age_minutes} 分钟前`;
    $('#pendingWhy').textContent = p.reason || '';
    $('#pendingList').innerHTML = (p.sample || []).map(x =>
      `<div class="row"><span class="badge del">删</span><span class="p">${esc(x)}</span></div>`).join('')
      + (p.count > (p.sample || []).length ? `<div class="row muted">…还有 ${p.count - p.sample.length} 条</div>` : '');
  } else {
    $('#pendingCard').style.display = 'none';
  }

  // 这一轮结果 —— 渲染器抽在 `showResult()` 里（「记录」点开走的也是它）
  // ⛔ 正在翻历史某一轮时（`RES_IS_LATEST === false`）**不许**被这个函数顶回最近一轮：
  //    它每 8 秒被 `setInterval` 调一次（见 `boot`），原来无条件重渲染 ⇒
  //    你刚点开的那轮会在几秒内被换走 —— 这就是「老是重置」的主因之一。
  //    （另一半主因是「内容没变也重建 DOM」，已在 `showResult` 用指纹挡掉。）
  const r = s.run || {};
  if ((r.result || r.finished) && RES_IS_LATEST) {
    showResult({ res: r.result || {}, det: r.detail || {}, finished: r.finished || '',
                 isLatest: true });
  }
  window.__state = s;
  renderSteps(s.steps);
  if (!HIST_LOADED) loadHist();
}

/* ---------------- 这一轮结果（**唯一**一块结果区） ----------------
   ⭐ 「最近一轮」与「记录里点开的某一轮」都走这一个渲染器。
   ⛔ 别为历史另写一份 —— 两处各写一份必然跑偏（本项目反复踩过这个坑，
      见 `goPage()` 上方、以及 `web.py` 里那段「web / cli 各写一遍就分叉」的注释）。
   ⚠️ 点开记录原来是把回执的 **Markdown 原文**塞进 `textContent`（深色块里一坨），
      红领巾 2026-10-11：「我想让他点开之后显示都处理了哪些数据」⇒ 改成表格。 */
let RES = null;          // 结果区当前那份回执（明细分段切换读它）
let HIST_LOADED = false;
// 🔴 现在看的是不是「最近一轮」。看历史时，后台那个 8 秒轮询**不许**把它顶掉 ——
//    原来没有这个判断，`loadState()` 每次都无条件重渲染 ⇒ 正在读的那轮被换走。
let RES_IS_LATEST = true;
// 当前展示的回执指纹。内容一模一样就**不重渲染** —— 这是「滚动老是被顶回去」的正解：
//    根因不是滚动位置丢了，是每 8 秒把整块 DOM 拆了重建。
let RES_FP = '';
// 每块的折叠状态（用户点过就以用户为准）。key = 块名（见 `secBox`）。
const SEC_FOLD = {};
// 每块的默认折叠态 —— 只有「请求与耗时」默认收起（流水长，平时不用看）。
const SEC_DEFAULT = { req: true };
// 明细列表当前选中的那一类（新增/更新/删除/已改名）—— 重渲染后要停在原地
let RES_SEG_CUR = 'add';

/* 毫秒 → 人读的时长。⚠️ 与后端 `sync._human()` 是**同一套口径**，两边都要保留小数，
   否则会出现「后端 1.2 秒、前端 0 秒」这种自己跟自己打架的显示。 */
function dur(ms) {
  ms = Math.max(0, Math.round(Number(ms) || 0));
  if (ms < 1000) return ms + ' 毫秒';
  const s = ms / 1000;
  if (s < 10) return s.toFixed(1) + ' 秒';
  if (s < 60) return Math.round(s) + ' 秒';
  const m = Math.floor(s / 60);
  if (m < 60) return m + ' 分 ' + Math.round(s % 60) + ' 秒';
  return Math.floor(m / 60) + ' 小时 ' + (m % 60) + ' 分';
}

/* 折叠箭头 —— 用 **SVG** 而不是「▾」字符。
   🔴 旧写法是 `<span class="car">▾</span>` + `font-size:11px; color:#9aa1ae`：
      字符的粗细/大小随字体族走，实测在 Windows 上细到几乎看不见 —— 这正是
      红领巾那句「根本分不清是不是展开了」的直接原因。
   ⚠️ 路径画的是**朝下**的钩（展开态），折叠态靠 CSS `rotate(-90deg)` 转成朝右。 */
const CARET = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';

/* 一块的 HTML。`k` 是块名（也是折叠状态的 key）。
   `o.empty` = 这块**本轮没内容** ⇒ 整行压灰 + 状态签写「空」（别让人点开才发现是空的）。 */
function secBox(k, o) {
  const folded = (k in SEC_FOLD) ? SEC_FOLD[k] : !!SEC_DEFAULT[k];
  const empty = !!o.empty;
  return `<section class="sec ${o.tone || ''}${empty ? ' empty' : ''}${folded ? ' fold' : ''}" data-k="${k}">
    <div class="sec-h" role="button" tabindex="0" aria-expanded="${folded ? 'false' : 'true'}"
         onclick="toggleSec('${k}')" onkeydown="secKey(event,'${k}')">
      <span class="car">${CARET}</span>
      <span class="tt">${o.icon || ''}${esc(o.title)}</span>
      ${o.sum ? `<span class="sum">${o.sum}</span>` : ''}
      <span class="sp">${empty ? '空' : (folded ? '展开' : '收起')}</span>
    </div>
    <div class="sec-b"${o.id ? ` id="${o.id}"` : ''}>${o.body || ''}</div>
  </section>`;
}

function toggleSec(k) {
  const el = document.querySelector(`.sec[data-k="${k}"]`);
  if (!el) return;
  const fold = el.classList.toggle('fold');
  SEC_FOLD[k] = fold;
  // ⚠️ 状态签与 aria 必须跟着改 —— 只改 class 的话，右边界面上还写着上一次的「展开/收起」，
  //    那就又回到「看不出开没开」了（折叠态是被 CSS 藏在 `.sec-b` 里的，肉眼看不到反例）。
  const h = el.querySelector('.sec-h');
  if (h) h.setAttribute('aria-expanded', fold ? 'false' : 'true');
  const sp = el.querySelector('.sp');
  if (sp && !el.classList.contains('empty')) sp.textContent = fold ? '展开' : '收起';
}

/* 标题行支持键盘（Enter / 空格）—— 它是 `role="button"`，不给键盘通路是半个按钮。 */
function secKey(ev, k) {
  if (ev.key !== 'Enter' && ev.key !== ' ') return;
  ev.preventDefault();
  toggleSec(k);
}

/* 重渲染前后把「看的人停在哪儿」原样搬回去 —— 主要管两处：
   ① 页面滚动：用结果卡标题做锚点（只记 scrollY 的话，上面提示条一多一少就偏）
   ② 结果内部那几个自带滚动条的盒子（明细列表 / 请求流水）。 */
function captureScroll() {
  const snap = { y: window.scrollY, boxes: {} };
  ['resList', 'reqAgg', 'reqFlow', 'log'].forEach(id => {
    const el = document.getElementById(id);
    if (el) snap.boxes[id] = el.scrollTop;
  });
  const card = document.getElementById('resultCard');
  snap.anchor = card ? card.getBoundingClientRect().top : null;
  return snap;
}
function restoreScroll(snap) {
  if (!snap) return;
  Object.keys(snap.boxes).forEach(id => {
    const el = document.getElementById(id);
    if (el && snap.boxes[id]) el.scrollTop = snap.boxes[id];
  });
  const card = document.getElementById('resultCard');
  if (card && snap.anchor != null) {
    const d = card.getBoundingClientRect().top - snap.anchor;
    if (Math.abs(d) > 1) window.scrollBy(0, d);
  }
}

// 明细里每种类型的短语——档 0 = 计数为 0 时也照样列（位置固定，好认）
const RES_SEG = [
  ['add', '新增'], ['update', '更新'], ['delete', '删除'], ['renamed', '已改名'],
];

/* 疑似「被截断的子树」到底是**哪几个** —— 光报数等于没说。
   🔴 红领巾 2026-10-11 看到「有 3 个条目既没有子项、也没有扩展名」：「这个也不知道说的是哪个」
   ⇒ 把后端存的前几条路径直接列出来。路径已由后端去掉树根那一段，直接对应 115 里的位置。 */
/* 「前几条路径」的通用渲染（截断子树 / 复核后保留，都用它）——
   光报数等于没说，红领巾要的是**是哪几个**。 */
function sampleList(items, total) {
  const s = items || [];
  if (!s.length) return '';
  const rest = (total || 0) - s.length;
  return `<div style="margin-top:6px;font-family:ui-monospace,monospace;font-size:12.5px;
    line-height:1.75;word-break:break-all">${
      s.map(p => '· ' + esc(p)).join('<br>')}${
      rest > 0 ? `<br>· …另有 ${n(rest)} 个未列出` : ''}</div>`;
}

function exList(res) {
  return sampleList(res.extensionless_sample,
    res.extensionless || (res.extensionless_sample || []).length);
}

/* 配不上的字幕 —— **按目录分组**。
   🔴 2026-10-11 红领巾：「直接显示文件我根本就不知道需要处理的文件在哪」
   ⇒ 先给**目录**（这才知道去哪儿处理），文件挂在它下面。
   ⚠️ **老回执没有 `dir` 键**（1.5 及以前只存了「视频 / 字幕 / 判定」）⇒ 绝不能当成
      「都在同步根下」（那是**说谎**，他一眼就会信）：`undefined` 与空串要分开 ——
      空串是**真·同步根下的文件**，`undefined` 是**这条回执压根没存目录**。 */
function umGroups(res) {
  const um = res.subs_unmatched || [];
  if (!um.length) return '';
  const more = res.subs_unmatched_more || 0;
  const by = {};
  um.forEach(x => {
    const d = (x.dir === undefined) ? '(这条回执没存目录 —— 下一轮跑完就有了)'
                                    : (x.dir || '(同步根)');
    (by[d] = by[d] || []).push(x);
  });
  const dirs = Object.keys(by).sort();
  return `<div class="note warn" style="margin-top:12px"><i>⚠</i><div>
      <b>有 ${n(um.length + more)} 个字幕跟视频名对不上</b> —— 只列出来、<b>没有下载</b>
      （配错字幕比没字幕更糟）。下面按 <b>目录</b> 列：${
        more ? `前 ${n(um.length)} 条涉及 ${dirs.length} 个目录` : `共 ${dirs.length} 个目录`}。
    </div></div>
    <div class="diff" style="margin-top:11px">${dirs.map(d => `<div class="it">
      <div class="l1"><span class="badge dir">目录</span>
        <span class="p"><b>${esc(d)}</b></span>
        <span class="u" style="flex:0 0 auto;max-width:none;padding-left:0">${by[d].length} 条</span></div>
      ${by[d].map(x => `<div class="u">${esc(x.sub || '')}　·　${esc(x.kind || '')}${
        x.video ? `　·　同目录视频：${esc(x.video)}` : '　·　同目录没找到相关视频'}</div>`).join('')}
    </div>`).join('')}${more ? `<div class="it" style="color:#78808f">…还有 ${n(more)} 条未列出</div>` : ''}</div>`;
}

function showResult({ res, det = {}, finished = '', isLatest = true }) {
  RES = res || {};
  RES_IS_LATEST = !!isLatest;
  $('#resultTitle').textContent = isLatest ? '这一轮结果' : '那一轮结果';
  $('#lastAt').textContent = finished || RES.started || '';
  $('#resultBack').classList.toggle('hidden', !!isLatest);

  // ⛔ 内容一模一样 ⇒ **一个 DOM 都不碰**。
  //    这是「滚动老是被顶回顶部」的真正解法（见 `RES_FP` 的注释）。
  const fp = fpOf(RES, det, finished, isLatest);
  if (fp === RES_FP) return;
  RES_FP = fp;

  const keep = captureScroll();
  $('#lastRun').innerHTML = resultBody(RES, det);
  restoreScroll(keep);
  // ⚠️ 明细列表必须在 innerHTML 之后填 —— 它有自己的 seg 选中态，由 `renderResList` 记账
  renderResList(RES_SEG_CUR);
}

/* 回执指纹 —— 只挑**会改变画面**的字段。
   ⛔ 别拿整份 JSON 的字符串当指纹：`subs_unmatched` 之类的长数组会让比对变慢，
      而且任意一个无关字段变动都会触发整块重渲染，等于把刚修好的毛病又装回去。 */
function fpOf(res, det, finished, isLatest) {
  const c = (res.diff && res.diff.counts) || {};
  return [isLatest ? 1 : 0, finished, res.started, res.finished,
          res.written, res.deleted, res.pending_delete, res.delete_kept, res.requests,
          res.elapsed, res.elapsed_total, res.elapsed_tree,
          res.scanned_remote, res.scanned_local, res.unchanged, res.renamed,
          res.dirs_made, res.dirs_skipped, res.dirs_pruned, res.extensionless,
          res.subs_downloaded, res.subs_planned, res.subs_skipped, res.subs_failed,
          res.subs_unmatched_more, res.guard_tripped, res.looks_like_move,
          (res.errors || []).length,
          c.add, c.update, c.delete, c.renamed,
          det.tree_origin || res.tree_origin || ''].join('|');
}

/* ⭐ 结果区正文 = 六个块。顺序按「先看结论、再看细节」排：
     概览 → 要注意的 → 目录 → 视频 strm → 字幕 → 请求与耗时
   ⛔ 别退回「一大坨 innerHTML」—— 那样「这段和那段是不是一回事」又得靠读的人自己猜。 */
function resultBody(res, det) {
  return [
    secOverview(res, det),
    secAlerts(res),
    secDirs(res, det),
    secMedia(res),
    (res.subs_planned || res.subs_enabled) ? secSubs(res) : '',
    secReq(res),
  ].join('');
}

/* 跳到某一块并展开（「请求」那个统计格点一下就落到明细上）。
   ⚠️ 展开**复用 `toggleSec`**，⛔ 别在这儿另抄一份「去掉 fold 类」——
     抄一份就会漏掉状态签/aria 的同步，又变回「看着像没展开」。 */
function jumpSec(k) {
  const el = document.querySelector(`.sec[data-k="${k}"]`);
  if (!el) return;
  if (el.classList.contains('fold')) toggleSec(k);
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ---------- ① 概览 ---------- */
function secOverview(res, det) {
  // ⭐ 「目录树是从哪来的」必须写出来 —— 否则他没法判断这一轮到底有没有真去打扰 115。
  //    更要紧的是区分「刚导的新树」与「退回用本机旧树」：退回 = 导树失败后的降级，
  //    不显眼就等于让人以为一切正常。
  //    ⚠️ `det.tree_origin` 只有「刚跑完那一轮」在内存里有；翻旧记录要读回执里的
  //       `res.tree_origin`（2026-10-11 起才落盘，更老的回执没这个键 ⇒ 这行会省掉）。
  const origin = String(det.tree_origin || res.tree_origin || '');
  const fellBack = origin.indexOf('本地') >= 0;
  const total = res.elapsed_total || res.elapsed || '';
  const body = `
    <div class="stats">
      <div class="stat pri"><div class="k">写入 strm</div><div class="v">${n(res.written)}</div></div>
      <div class="stat bad"><div class="k">删除 strm</div><div class="v">${n(res.deleted)}</div></div>
      <div class="stat warn"><div class="k">挂起待确认</div><div class="v">${n(res.pending_delete)}</div></div>
      <div class="stat click" onclick="jumpSec('req')" title="点开看这 ${n(res.requests)} 次请求具体做了什么">
        <div class="k">115 请求 ▾</div><div class="v">${n(res.requests)}</div></div>
      <div class="stat"><div class="k">整轮耗时</div>
        <div class="v" style="font-size:16px">${esc(total || '—')}</div></div>
      <div class="stat ${fellBack ? 'warn' : ''}"><div class="k">目录树</div>
        <div class="v" style="font-size:13.5px">${
          origin ? (fellBack ? '本机旧树 ⚠' : '刚导的新树') : '—'}</div></div>
    </div>
    <div class="muted" style="margin-top:11px;line-height:1.8">
      网盘条目 <b>${n(res.scanned_remote)}</b> ·
      本地已有 strm <b>${n(res.scanned_local)}</b> ·
      内容没变跳过 <b>${n(res.unchanged)}</b>
      ${res.renamed ? ` · 本地改过名保留 <b>${n(res.renamed)}</b>` : ''}
    </div>
    ${res.pending_delete ? `<div class="muted" style="margin-top:4px">
      ⏳ 有 <b>${n(res.pending_delete)}</b> 个 strm 判为<b>不该自动删</b>（异常 / 变动面过大）——
      清单和原因在最上面那张「待确认删除」卡里（这一轮<b>没有</b>真删）。</div>` : ''}
    ${origin ? `<div class="muted" style="margin-top:4px">目录树来源：${esc(origin)}</div>` : ''}
    ${res.elapsed_tree ? `<div class="muted" style="margin-top:4px">
      耗时拆开：导目录树 <b>${esc(res.elapsed_tree)}</b> ＋ 对账落盘 <b>${esc(res.elapsed || '—')}</b>
      （主位显示的是两者之和）</div>` : ''}`;
  return secBox('ov', {
    icon: '📊 ', title: '概览',
    sum: `写 ${n(res.written)} · 删 ${n(res.deleted)} · 请求 ${n(res.requests)}`,
    body,
  });
}

/* ---------- ② 要注意的（有内容才出现） ---------- */
function secAlerts(res) {
  const items = [];
  if (res.guard_tripped) items.push(['bad', '⚠',
    `<b>异常闸门已触发 —— 本轮没有删除</b>：${esc(res.guard_reason || '')}`]);
  if (res.looks_like_move) items.push(['info', '🔀',
    '本轮判定为<b>改名 / 移动</b>（消失的条数 ≈ 新增的条数），不是异常。']);
  if (res.subs_guard_tripped) items.push(['warn', '⚠',
    `字幕的异常闸门触发了 —— 本轮没删本地字幕：${esc(res.subs_guard_reason || '')}`]);
  if ((res.errors || []).length) {
    items.push(['bad', '⛔', `有 <b>${n(res.errors.length)}</b> 条错误：<br>` +
      res.errors.slice(0, 8).map(e =>
        `· ${esc(e.kind || '')}：${esc(String(e.msg || '').slice(0, 200))}`).join('<br>')]);
  }
  if (!items.length) return '';
  const worst = items.some(x => x[0] === 'bad') ? 'bad' : 'warn';
  return secBox('alert', {
    icon: '⚠️ ', title: '要注意的', tone: worst, sum: `${items.length} 条`,
    body: items.map(([c, i, t], k) =>
      `<div class="note ${c}"${k === items.length - 1 ? ' style="margin-bottom:0"' : ''}>
        <i>${i}</i><div>${t}</div></div>`).join(''),
  });
}

/* ---------- ③ 目录 ---------- */
function secDirs(res, det) {
  const origin = String(det.tree_origin || res.tree_origin || '');
  let body = `<div class="stats">
      <div class="stat"><div class="k">新建目录</div><div class="v">${n(res.dirs_made)}</div></div>
      <div class="stat"><div class="k">整树无视频 · 没收</div><div class="v">${n(res.dirs_skipped)}</div></div>
      <div class="stat"><div class="k">收掉空目录</div><div class="v">${n(res.dirs_pruned)}</div></div>
    </div>`;
  if (res.extensionless) {
    body += `<div class="note warn" style="margin:12px 0 0"><i>⚠</i><div>
      <b>这份目录树里有 ${n(res.extensionless)} 个条目既没有子项、也没有扩展名</b> ——
      这几乎只能是<b>导出时层级选少了</b>（子树被截断），不是空目录。工具已把它们全部忽略。
      ${res.source === 'tree' && origin && origin.indexOf('自动导出') < 0
        ? '<br>你这份是<b>手动导</b>的 ⇒ 重新导一次，把层级拉到最大即可。'
        : '<br>工具自己导时已按 115 的上限 25 层导。'}
      ${exList(res)}
    </div></div>`;
  }
  // 「有没有内容」= 这一轮目录相关的动作**全为 0**。
  // ⚠️ `extensionless` 也算内容 —— 它是一条**要人看的告警**，漏掉就会出现
  //    「状态签写着「空」、点开却有一条红字」的自相矛盾。
  const empty = !(res.dirs_made || res.dirs_skipped || res.dirs_pruned || res.extensionless);
  return secBox('dir', {
    icon: '📁 ', title: '目录',
    sum: empty ? '本轮没有目录变动'
      : `建 ${n(res.dirs_made)} · 跳 ${n(res.dirs_skipped)} · 收 ${n(res.dirs_pruned)}`,
    tone: res.extensionless ? 'warn' : '',
    empty,
    body,
  });
}

/* ---------- ④ 视频 strm（分段 + 明细）---------- */
function secMedia(res) {
  const cx = (res.diff && res.diff.counts) || {};
  const del = cx.delete || 0;
  const pend = res.pending_delete || 0;
  const kept = res.delete_kept || 0;
  // 🔴 2026-10-13 实测撞出来的歧义：概览说「删除 0」、这块说「删 154」——
  //    两处都对（**判定要删** 154 个，但实际没删），可摆在一起读就是「自相矛盾」。
  //    ⇒ 这里必须把「判定 / 已删 / 挂起 / 保留」四个数分开说。
  // ⚠️ 2026-10-20：正常情况**当轮就删完了**，所以「挂起」这条现在只在异常时出现。
  const notes = [];
  if (pend) {
    notes.push(`<div class="note warn"><i>⏳</i><div>
      判定要删 <b>${n(del)}</b> 个 strm，本轮<b>一个都没自动删</b> ——
      原因和清单在最上面那张「<b>待确认删除</b>」卡里。
      确认无误就点那张卡上的「确认删除」。</div></div>`);
  } else if (del && res.deleted) {
    notes.push(`<div class="note ok"><i>✅</i><div>
      已删除 <b>${n(res.deleted)}</b> 个本地 strm
      （当轮复核过：网盘上确实没了）。</div></div>`);
  }
  if (kept) {
    notes.push(`<div class="note warn"><i>↩️</i><div>
      另有 <b>${n(kept)}</b> 条判定要删、但复核时发现<b>网盘上还在</b>
      ⇒ 保留本地没删（宁可多留一轮，不可误删）。
      ${sampleList(res.delete_kept_sample, kept)}</div></div>`);
  }
  const note = notes.length
    ? `<div style="margin-bottom:11px">${notes.join('')}</div>` : '';
  const body = note + `
    <div class="seg" id="resSeg" style="margin-bottom:11px">
      ${RES_SEG.map(([t, lab], i) => `<button data-t="${t}"${i ? '' : ' class="on"'}
        onclick="renderResList('${t}')">${lab}
        <span class="muted">${n(cx[t] != null ? cx[t] : 0)}</span></button>`).join('')}
    </div>
    <div class="diff" id="resList"></div>
    <div class="muted" style="font-size:12.5px;margin-top:9px;word-break:break-all" id="resMore"></div>`;
  // ⚠️ 「挂起 / 复核保留」也算内容：`del` 是**判定要删**的条数，
  //    `res.deleted` 是实际删掉的，`kept` 是复核后留下的。
  const empty = !(cx.add || cx.update || del || cx.renamed);
  return secBox('media', {
    icon: '🎬 ', title: '视频 strm',
    sum: empty ? '本轮没有 strm 变动'
      : `增 ${n(cx.add || 0)} · 改 ${n(cx.update || 0)} · 删 ${n(del)}` +
        (pend ? `（挂起 ${n(pend)}）` : (kept ? `（保留 ${n(kept)}）` : '')) +
        ` · 留 ${n(cx.renamed || 0)}`,
    empty,
    body,
  });
}

/* ---------- ⑤ 字幕 ---------- */
function secSubs(res) {
  const stat = [
    ['能配上', n(res.subs_planned)],
    ['本轮下载', n(res.subs_downloaded)],
    ['本地已有跳过', n(res.subs_skipped)],
  ];
  if (res.subs_skipped_ext) stat.push(['按设置跳过', n(res.subs_skipped_ext)]);
  if (res.subs_deleted) stat.push(['删除本地', n(res.subs_deleted)]);
  if (res.subs_pending_delete) stat.push(['挂起待确认', n(res.subs_pending_delete)]);
  if (res.subs_failed) stat.push(['失败', n(res.subs_failed)]);
  let body = `<div class="stats">${stat.map(([k, v], i) =>
    `<div class="stat${k === '失败' && res.subs_failed ? ' bad' : ''}">
      <div class="k">${k}</div><div class="v">${v}</div></div>`).join('')}</div>`;
  if (!res.subs_enabled) {
    body += `<div class="note info" style="margin:12px 0 0"><i>ℹ</i><div>
      这功能<b>没开</b>（设置 › 字幕 › 下载外挂字幕到本地）。上面是「开了会怎样」。</div></div>`;
  }
  if ((res.subs_notes || []).length) {
    body += (res.subs_notes.slice(0, 10).map(t =>
      `<div class="muted" style="margin-top:6px">· ${esc(t)}</div>`).join(''));
  }
  body += umGroups(res);
  // ⚠️ `subs_unmatched` 也算内容 —— 那是「配不上的字幕」，要人看（且 tone 会变 warn）。
  const empty = !(res.subs_planned || res.subs_downloaded || res.subs_skipped ||
                  res.subs_failed || (res.subs_unmatched || []).length);
  return secBox('subs', {
    icon: '💬 ', title: '字幕',
    sum: empty ? '本轮没有字幕要处理'
      : `能配 ${n(res.subs_planned)} · 下 ${n(res.subs_downloaded)} · 跳 ${n(res.subs_skipped)}` +
        (res.subs_failed ? ` · 败 ${n(res.subs_failed)}` : ''),
    tone: (res.subs_unmatched || []).length ? 'warn' : '',
    empty,
    body,
  });
}

/* ---------- ⑥ 请求与耗时（默认收起）----------
   ⭐ 2026-10-13 新增。红领巾：「我想看看它都具体操作了什么」——
      以前只给一个「请求 60」，而 60 次**轮询导出状态**（正常）和
      60 次**逐层扫目录**（接口选错）在数字上长得一模一样。 */
/* 归并行的「说明」去掉「（第 N 次查询）」这类**实例细节** ——
   那是下面流水列该说的话；归并这一层要回答的是「这个接口是干嘛的」。
   （实测撞到：归并首行显示成「等导出任务 #… 跑完（第 1 次查询）」，
     而它明明统计了 3 次 —— 看着别扭。） */
function stripSeq(s) { return String(s || '').replace(/（第 \d+ 次[^）]*）/g, ''); }

function secReq(res) {
  const rd = res.req_detail || {};
  const by = rd.by_name || [];
  const items = rd.items || [];
  const th = rd.throttle || {};

  if (!rd.total) {
    return secBox('req', {
      icon: '⏱ ', title: '请求与耗时', sum: `请求 ${n(res.requests)}`, empty: true,
      body: `<div class="muted">这份回执没存请求明细（是加这个功能之前的版本跑的）。
        下一轮跑完就有了。</div>`,
    });
  }

  const head = `<div class="stats" style="margin-bottom:13px">
      <div class="stat"><div class="k">请求总数</div><div class="v">${n(rd.total)}</div></div>
      <div class="stat"><div class="k">其中 · 接口耗时</div>
        <div class="v" style="font-size:16px">${esc(dur(rd.request_ms))}</div></div>
      <div class="stat"><div class="k">其中 · 节流等待</div>
        <div class="v" style="font-size:16px">${esc(dur(rd.wait_ms))}</div></div>
      <div class="stat ${rd.failed ? 'bad' : 'ok'}"><div class="k">失败</div>
        <div class="v">${n(rd.failed)}</div></div>
    </div>
    <div class="muted" style="margin-bottom:13px;line-height:1.8">
      整轮 <b>${esc(res.elapsed_total || res.elapsed || '—')}</b>
      ${res.elapsed_tree ? `＝ 导目录树 <b>${esc(res.elapsed_tree)}</b> ＋ 对账落盘 <b>${esc(res.elapsed || '—')}</b>` : ''}
      ${th.sleeps != null ? `<br>节流：随机间隔睡 <b>${n(th.sleeps)}</b> 次（累计 ${esc(dur((th.slept_seconds || 0) * 1000))}）·
        长休 <b>${n(th.rests)}</b> 次 · 冷却 <b>${n(th.cooldowns)}</b> 次` : ''}
    </div>`;

  const agg = `<div class="muted" style="margin-bottom:7px">按接口归并（次数多的在前）
      —— 「哪个接口被反复调」通常就是「这一轮到底在干嘛」的答案：</div>
    <div class="reqbox" id="reqAgg" style="margin-bottom:15px">
      <table class="tbl">
        <thead><tr><th>接口</th><th class="num">次数</th><th class="num">接口耗时</th>
          <th class="num">节流等待</th><th class="num">失败</th></tr></thead>
        <tbody>${by.map(r => `<tr${r.failed ? ' class="badness"' : ''}>
          <td class="mono">${esc(r.name)}<div class="muted" style="font-size:12px;margin-top:2px">
            ${esc(stripSeq(r.note))}</div></td>
          <td class="num">${n(r.count)}</td>
          <td class="num">${esc(dur(r.ms))}</td>
          <td class="num">${esc(dur(r.wait_ms))}</td>
          <td class="num">${r.failed ? n(r.failed) : '—'}</td></tr>`).join('')}</tbody>
      </table></div>`;

  const flow = `<div class="muted" style="margin-bottom:7px">逐次流水
      —— 按发生顺序，看得出每一步在干什么：</div>
    <div class="reqbox" id="reqFlow">
      <table class="tbl">
        <thead><tr><th class="num">#</th><th>时刻</th><th>接口</th><th>在干什么</th>
          <th class="num">耗时</th><th class="num">等待</th></tr></thead>
        <tbody>${items.map(x => `<tr${x.ok ? '' : ' class="badness"'}>
          <td class="num">${x.seq}</td>
          <td class="num">${esc(x.at)}</td>
          <td class="mono">${esc(x.name)}</td>
          <td>${esc(x.note || '')}${x.err ? `<div style="color:#b91c1c">${esc(x.err)}</div>` : ''}</td>
          <td class="num">${esc(dur(x.ms))}</td>
          <td class="num">${esc(dur(x.wait_ms))}</td></tr>`).join('')}</tbody>
      </table></div>
    ${rd.dropped ? `<div class="muted" style="margin-top:8px">
      流水只列了前 ${n(rd.shown)} 条，另有 <b>${n(rd.dropped)}</b> 条未列
      （上面的归并统计是完整的）。</div>` : ''}`;

  return secBox('req', {
    icon: '⏱ ', title: '请求与耗时',
    sum: `${n(rd.total)} 次 · 接口 ${esc(dur(rd.request_ms))} · 等待 ${esc(dur(rd.wait_ms))}`,
    body: head + agg + flow,
  });
}

/* 明细列表。`hasList=false` ⇒ 这份回执是旧版本跑的（只存了计数、没存明细）。
   ⚠️ 选中的那一类记在 `RES_SEG_CUR` —— 重渲染（换一轮 / 轮询命中）之后还停在
      「删除」这类上，不会跳回「新增」。 */
function renderResList(t, hasList) {
  if (t === undefined) t = RES_SEG_CUR || 'add';
  RES_SEG_CUR = t;
  if (hasList === undefined) {
    hasList = !!(RES && RES.diff && (RES.diff.add || RES.diff.update || RES.diff.delete));
  }
  $$('#resSeg button').forEach(x => x.classList.toggle('on', x.dataset.t === t));
  const d = (RES && RES.diff) || {};
  const more = (d.more && d.more[t]) || 0;
  const items = d[t] || [];
  const lab = { add: '增', update: '改', delete: '删', renamed: '留' }[t];

  if (!hasList) {
    $('#resList').innerHTML = `<div class="it" style="color:#78808f">
      这一轮是旧版本跑的 —— 回执里只存了计数，没有「动了哪些文件」的明细。</div>`;
    $('#resMore').innerHTML = '';
    return;
  }
  if (!items.length) {
    $('#resList').innerHTML = `<div class="it" style="color:#78808f">没有</div>`;
  } else if (t === 'renamed') {
    $('#resList').innerHTML = items.map(x => `<div class="it">
      <div class="l1"><span class="badge upd">${lab}</span><span class="p">${esc(x.local)}</span></div>
      <div class="u">↔ 网盘上的 ${esc(x.remote)}　（内容一致 ⇒ 不动它）</div></div>`).join('');
  } else {
    $('#resList').innerHTML = items.map(rel => `<div class="it">
      <div class="l1"><span class="badge ${t === 'add' ? 'add' : (t === 'delete' ? 'del' : 'upd')}">${lab}</span><span class="p">${esc(rel)}</span></div>
      <div class="u">${t === 'add' ? '本地没有 → 新建这个 strm'
        : (t === 'delete' ? '本地有、网盘上没了 → 当轮复核后删除（复核说还在就保留；异常则挂起等确认）'
                          : '文件还在、内容变了 → 重写这个 strm')}</div></div>`).join('');
  }
  $('#resMore').innerHTML = more ? `…还有 ${n(more)} 条未列出（回执 JSON 里有前 ${n(500)} 条）` : '';
}

/* 「← 回到最近一轮」 */
function showLatest() {
  const s = window.__state || {};
  const r = s.run || {};
  if (!(r.result || r.finished)) { toast('还没有跑过'); return; }
  showResult({ res: r.result || {}, det: r.detail || {}, finished: r.finished || '',
               isLatest: true });
  $('#resultCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* 「这一轮会做什么」—— 条目**来自后端** `pipeline.SYNC_STEPS`（单一事实源）。
   ⛔ 别把文案写死在这里：后端改一次、前端不改，两边就对不上了。 */
function renderSteps(steps) {
  const box = $('#stepList');
  if (!box || !Array.isArray(steps)) return;
  const html = steps.map(s => `<li><div>
    <span class="t">${bold(s.title)}</span>
    <span class="h">${bold(s.help)}</span></div></li>`).join('');
  // ⚠️ 本函数被 8 秒轮询**每轮都调**。内容没变就别重写 —— 重写会重建 DOM 节点，
  //    把读者选中的文字冲掉（与结果区 `RES_FP` 指纹是同一个教训，只是这里更简单）。
  if (box.dataset.fp !== html) { box.innerHTML = html; box.dataset.fp = html; }
  // 折叠态下也要能看出「里面有几条」。⚠️ 只报**条数**，不做内容摘要 ——
  // 摘要等于把 SYNC_STEPS 的文案再抄一遍，后端改一次这里就漂了（本项目吃过分叉的亏）。
  const sum = $('#stepSum');
  if (sum) sum.textContent = `${steps.length} 步`;
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
/* 先转义再认 `**加粗**` —— 后端的 SYNC_STEPS 文案里用了它，直接 esc 会把星号原样显示出来。
   ⚠️ 顺序不能反：先 esc 再 replace，否则 `<b>` 会被自己转义掉。 */
function bold(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }

/* ---------------- 同步 ---------------- */
/* ⛔ 这里原来有一整套「只演练」开关（`DRY_ON` / `DRY_FIXED` / `syncDryUI()` /
   `setDry()` / `applyDry()`，三处同时表意：轨道颜色 + 开/关文字 + 状态条）。
   2026-10-11 红领巾：「一般用不上」⇒ 整条链一起拆了（`dry_run` 配置项、
   设置字段、`/api/run` 入参、回执里的「演练（未落盘）」分支）。

   ⭐ 「先看再动」没有消失 —— 它换成了**「预览差异」按钮**（走 `/api/preview`）：
      零请求、一个文件都不写、**没有持久状态**，所以不会出现下面那个坑：
      「忘了关 ⇒ 定时任务每轮都只演练、还报跑成功」。
   ⛔ 别再把它做成持久开关。 */

/* ⛔ 这里原来有 `MODE_DESC` / `setMode()` / 四个模式按钮的绑定 ——
   2026-10-08 全部删掉：只有一条路，没有「模式」这个概念了。
   它的 UI 位子换成了「这一轮会做什么」（见上面的 `renderSteps`）。
   ⛔ 别在初始化时再调 `setMode(MODE)` —— 函数和 `MODE` 变量都一起没了。 */

async function preview() {
  toast('正在算差异…');
  try {
    const d = await api('/api/preview', { method: 'POST', body: JSON.stringify({ limit: 300 }) });
    PREV = d;
    $('#prevCard').classList.remove('hidden');
    const c = d.counts;
    $('#prevHint').textContent = d.tree_file.split(/[\\/]/).pop();
    $('#prevStats').innerHTML = [
      ['新增', c.add, 'pri'], ['更新', c.update, 'ok'],
      ['删除', c.delete, 'bad'], ['已改名', c.renamed || 0, ''],
      ['本地已有', d.local_strm, ''],
      ['网盘条目', d.remote_files, ''],
    ].map(([k, v, cls]) => `<div class="stat ${cls}"><div class="k">${k}</div><div class="v">${n(v)}</div></div>`).join('');
    renderPrev('add');
  } catch (e) { toast('失败：' + e.message); }
}
function renderPrev(t) {
  if (!PREV) return;
  $$('#prevSeg button').forEach(x => x.classList.toggle('on', x.dataset.t === t));

  // ⭐「已改名」是**独立一类**：它既不是新增也不是删除 ——
  //    本地 strm 被你改过名，内容仍与网盘一致 ⇒ **原样保留、什么都不做**。
  if (t === 'renamed') {
    const items = PREV.renamed || [];
    const more = (PREV.more && PREV.more.renamed) || 0;
    if (!items.length) {
      $('#prevList').innerHTML = `<div class="it" style="color:#78808f">没有</div>`;
    } else {
      $('#prevList').innerHTML = items.map(x => `<div class="it">
        <div class="l1"><span class="badge upd">留</span><span class="p">${esc(x.local)}</span></div>
        <div class="u">↔ 网盘上的 ${esc(x.remote)}　（内容一致 ⇒ 不动它）</div></div>`).join('');
    }
    $('#prevMore').innerHTML = (more ? `<div>…还有 ${n(more)} 条未列出</div>` : '') +
      `<div style="margin-top:6px">这类是<b>你自己改过名字</b>的 strm —— 工具靠内容认出了它对应哪个网盘文件，
       所以既不重生成、也不删除。</div>`;
    return;
  }

  const items = (PREV.samples && PREV.samples[t]) || [];
  const more = (PREV.more && PREV.more[t]) || 0;
  const lab = { add: '增', update: '改', delete: '删' }[t];

  // ⚠️ 两行式：路径一行（能看清）、URL 一行（小字缩进）。
  //    原来一行并排会让长路径把 URL 挤没，两边都读不了。
  //    URL 显示**解码后**的形态 —— 编码是给机器看的（`%E5%8A%9F`），
  //    人要读的是「这条到底指向网盘上哪个文件」。
  function readable(u) {
    if (!u) return '';
    let s = u;
    try { s = decodeURIComponent(u); } catch (e) { /* 编码不合法就原样显示 */ }
    const i = s.indexOf('/d/');
    return i >= 0 ? '…' + s.slice(i) : s;
  }

  if (!items.length) {
    $('#prevList').innerHTML = `<div class="it" style="color:#78808f">没有</div>`;
  } else {
    $('#prevList').innerHTML = items.map(x => {
      if (t === 'delete') {
        return `<div class="it"><div class="l1"><span class="badge del">${lab}</span><span class="p">${esc(x)}</span></div>
          <div class="u">本地已有、网盘上没有 → 将删除这个 strm</div></div>`;
      }
      const urlLine = t === 'update'
        ? `现在：<b>${esc(readable(x.url))}</b><br>原先：${esc(readable(x.was))}`
        : esc(readable(x.url || ''));
      return `<div class="it ${t === 'update' ? 'was' : ''}">
        <div class="l1"><span class="badge ${t === 'add' ? 'add' : 'upd'}">${lab}</span><span class="p">${esc(x.rel)}</span></div>
        <div class="u">${urlLine}</div></div>`;
    }).join('');
  }
  const sampleLine = PREV.prefix_sample
    ? `<div style="margin-top:10px">strm 内容样例（解码后）：<br><span class="mono">${esc(readable(PREV.prefix_sample))}</span></div>` : '';
  $('#prevMore').innerHTML = (more ? `<div>…还有 ${n(more)} 条未列出（完整清单在回执里）</div>` : '') + sampleLine;
}
$$('#prevSeg button').forEach(b => b.onclick = () => renderPrev(b.dataset.t));

async function run() {
  // ⛔ 不传 `mode`（只有一条路）、不传 `dry_run`（2026-10-11 已删）。
  // ⚠️ 原来这里靠「只演练开着就不拦」当安全阀；演练删掉后，这道 confirm 就是
  //    **动手前最后一道明示**（真正的保险仍在后端：删除要先复核网盘 + 比例闸门，
  //    而且只删 `.strm`、只删落在输出目录里的）。⛔ 别顺手把它也删了。
  if (!confirm('会真的写文件，并可能删除本地 strm（删除前会复核网盘）。\n'
               + '想先看一眼点「预览差异」——那一步零请求、一个文件都不动。\n继续？')) return;
  try {
    await api('/api/run', { method: 'POST', body: JSON.stringify({ force_delete: false }) });
    LOGSEQ = 0; $('#log').innerHTML = '';
    poll();
  } catch (e) { toast('失败：' + e.message); }
}
async function stop() {
  try { await api('/api/run/stop', { method: 'POST' }); toast('已请求停止'); } catch (e) { toast(e.message); }
}
async function applyPending() {
  // ⚠️ 把「为什么挂着」再念一遍 —— 这张卡现在只在**异常**情况下出现，
  //    点确认就真删，不能让他只看到一句「确认删除这些？」。
  const q = (window.__state && window.__state.pending) || {};
  if (!confirm(`${q.reason ? q.reason + '\n\n' : ''}确认删除这 ${q.count || 0} 个本地 strm？（不可撤销）`)) return;
  try { const r = await api('/api/pending/apply', { method: 'POST' }); toast(`已删 ${r.deleted} 个`); loadState(); }
  catch (e) { toast(e.message); }
}
async function cancelPending() {
  try { const r = await api('/api/pending/cancel', { method: 'POST' }); toast(`已取消 ${r.cancelled} 条`); loadState(); }
  catch (e) { toast(e.message); }
}

function poll() {
  clearInterval(TIMER);
  TIMER = setInterval(async () => {
    let s;
    try { s = await api('/api/run?after=' + LOGSEQ); } catch (e) { return; }
    $('#log').innerHTML += (s.log || []).map(l =>
      `<div class="${l.level}"><span class="t">${l.t}</span>${esc(l.msg)}</div>`).join('');
    LOGSEQ = s.log_seq;
    // ⚠️ 只有「本来就在最底下」才自动跟到底 —— 否则你往上翻着看，
    //    新来一行就把你拽回去（那也是一种「滚动被重置」）。
    const el = $('#log');
    if (el.scrollHeight - el.scrollTop - el.clientHeight < 40) el.scrollTop = el.scrollHeight;
    $('#logHint').textContent = s.running ? '运行中' : (s.finished || '');

    $('#btnRun').disabled = s.running;
    $('#btnStop').style.display = s.running ? '' : 'none';
    $('#runBar').classList.toggle('hidden', !s.running);

    if (s.running || s.written || s.deleted || s.error) {
      $('#runStats').style.display = '';
      // ⭐ 运行中也要有「已用时」—— 红领巾 2026-10-13：
      //    「耗时只显示 0 让我判断不准到底是运行出问题了，还是别的什么」。
      //    跑的时候看着秒数在涨，就知道它还活着；卡住不动一眼能看出来。
      const cells = [
        ['写入', n(s.written), 'pri'], ['删除', n(s.deleted), 'bad'],
        ['挂起', n(s.pending_delete), 'warn'], ['请求', n(s.requests), ''],
      ];
      if (s.running) cells.push(['已用时', s.elapsed_running || '—', '']);
      $('#runStats').innerHTML = cells.map(([k, v, cls]) =>
        `<div class="stat ${cls}"><div class="k">${k}</div>
          <div class="v" style="font-size:${k === '已用时' ? '16px' : '21px'}">${v}</div></div>`).join('');
    }
    if (s.error) $('#log').innerHTML += `<div class="error">${esc(s.error)}</div>`;
    if (!s.running) {
      clearInterval(TIMER); TIMER = null;
      $('#runBar').classList.add('hidden'); $('#btnRun').disabled = false;
      if (s.error) toast(s.error.slice(0, 60)); else if (s.finished) toast('本轮结束');
      loadState();
      loadHist();       // 本轮刚写出一份新回执 ⇒ 记录列表立刻跟上
    }
  }, 900);
}

/* ---------------- 同步范围（目录选择器） ---------------- */
// ⚠️ `SCOPE.includes` 有两层含义要分清：
//     · 从服务端读回来的「已保存的」
//     · 用户**当前勾着还没保存的**
//   `dirty=True` 表示用户改过、还没保存 ⇒ 此时**不能再被服务端值覆盖**。
//   （这个坑踩过：勾了之后 `loadScope()` 重读服务端 ⇒ 勾选被静默清掉、
//     界面看着「点了没反应」。）
// `tree_missing`：null = 还没问过 / false = 有树 / true = 没树。
//   —— 它决定「同步范围」卡是正常态，还是「等一棵目录树」的降级态（见 updateBadges）。
let SCOPE = { remote_root: '', includes: [], path: '', node: null, dirty: false, tree_missing: null };

async function loadScope(path) {
  try {
    const q = (path === undefined) ? (SCOPE.path || '') : path;
    const d = await api('/api/scope?path=' + encodeURIComponent(q));
    SCOPE.tree_missing = false;
    SCOPE.path = d.node.path;
    SCOPE.node = d;
    SCOPE.tree_root = d.tree_root;
    if (d.scope.remote_root) SCOPE.remote_root = d.scope.remote_root;
    if (!SCOPE.dirty) SCOPE.includes = d.scope.includes.slice();   // ⛔ 改过就别覆盖
    renderScope(d);
  } catch (e) {
    // 🔴 「目录树读不到」**不是故障**，是首次使用一定会撞上的状态 ——
    //    树由工具每轮同步时自己导（`data/tree/`），所以这里必须说清「先去跑一轮」。
    //    原来只把后端异常原样甩出来（`目录树读不到：[Errno 2] …`），
    //    新用户只会以为工具坏了，猜不到要先跑一轮。
    const noTree = String(e.message || '').indexOf('目录树读不到') === 0;
    SCOPE.tree_missing = noTree;
    SCOPE.node = null;
    $('#scopeOut').innerHTML = noTree
      ? noTreeHint()
      : `<div class="note bad"><i>⚠</i><div>${esc(e.message)}</div></div>`;
  }
  // ⚠️ 清单必须一起重画 —— 「有没有目录树」正是第 3 步的判据。
  //    而 `loadSettings` 常常**先于** `loadScope` 返回（导树文件比配置大得多），
  //    只刷徽章的话，第 3 步会一直停在「要先跑一轮」——树明明已经在了。
  renderSetup();
  updateBadges();
}

function noTreeHint() {
  return `<div class="note warn"><i>⚠</i><div>
      这一段要靠<b>目录树</b>才列得出你的目录 —— 而现在还没有树。<br>
      树不是你手动导的，是<b>工具跑一轮时自己导</b>的（落在 <span class="mono">data/tree/</span>，只留最近 5 份）。</div></div>
    <div class="actions">
      <button class="btn pri sm" onclick="goPage('sync')">去「同步」页跑一轮 →</button>
      <span class="muted" style="font-size:12.5px">
        它会自己导一份目录树 —— 你什么都不用手动导</span>
    </div>`;
}

// 不重新请求，只按当前内存状态重画（勾选走这条路）
function rerenderScope() {
  if (SCOPE.node) renderScope(SCOPE.node);
}

// 一个目录的「归属路径」：相对同步根。用于判断某个可见项是否已在白名单里。
function relToRoot(p) {
  const r = (SCOPE.remote_root || '').replace(/^\/+|\/+$/g, '');
  if (!r) return p;
  return p === r ? '' : (p.startsWith(r + '/') ? p.slice(r.length + 1) : null);
}

function renderScope(d) {
  // 面包屑
  const crumbs = d.crumbs.map((c, i) => {
    const last = i === d.crumbs.length - 1;
    return (i ? '<span class="sep">›</span>' : '') +
      (last ? `<span class="cur">${esc(c.name)}</span>`
            : `<button onclick="loadScope('${esc(c.path)}')">${esc(c.name)}</button>`);
  }).join('') || '<span class="cur">（树根）</span>';

  const incs = SCOPE.includes;
  const chips = incs.length
    ? incs.map(x => `<span class="chip"><span>${esc(x)}</span>
        <button title="移除" onclick="togglePick('${esc(x)}', false)">×</button></span>`).join('')
    : `<span class="all">未限定 —— 同步根下的全部目录都会处理</span>`;

  const items = d.items || [];
  const rows = items.length ? items.map(it => {
    const rel = relToRoot(it.path);
    const inScope = incs.some(x => it.path === x || it.path.startsWith(x + '/') || x.startsWith(it.path + '/'));
    const dirSel = rel !== null && rel !== '' && incs.includes(rel);
    const meta = it.subdirs ? `${it.subdirs} 子目录 · ${it.files} 文件` : `${it.files} 文件`;
    const canPick = rel !== null && rel !== '';
    return `<div class="pick ${inScope ? 'on' : ''}">
      ${canPick
        ? `<input type="checkbox" ${dirSel ? 'checked' : ''}
             onchange="togglePick('${esc(rel)}', this.checked)">`
        : '<span style="width:16px;flex:0 0 auto"></span>'}
      <span class="nm" onclick="loadScope('${esc(it.path)}')">${esc(it.name)}</span>
      <span class="meta">${meta}</span>
      ${it.has_children ? `<button class="go" onclick="loadScope('${esc(it.path)}')">进入 ›</button>` : ''}
    </div>`;
  }).join('') : `<div class="pick" style="color:#78808f">这一层没有子目录</div>`;

  $('#scopeOut').innerHTML = `
    <div class="grid" style="margin-bottom:13px">
      <div class="field">
        <label>同步根目录（相对目录树）</label>
        <input type="text" id="scopeRoot" value="${esc(SCOPE.remote_root || '')}"
               placeholder="影音" onchange="SCOPE.remote_root=this.value.trim();SCOPE.dirty=true">
        <div class="desc">它必须与 strm 前缀<b>配对</b> —— 前缀末段应等于它的末段。</div>
      </div>
      <div class="field">
        <label>只处理这些子目录${incs.length ? `（${incs.length}）` : ''}</label>
        <div class="picked" id="scopePicked">${chips}</div>
        <div class="desc">勾一个 = 处理它整棵子树。留空 = 全部都要。</div>
      </div>
    </div>

    <div class="crumbs">${crumbs}</div>
    <div class="picker">${rows}</div>

    <div class="actions" style="margin-top:12px">
      <button class="btn sm" onclick="loadScope('${esc(SCOPE.remote_root)}')">回到顶层</button>
      <button class="btn sm" onclick="togglePick('${esc(relToRoot(d.node.path) || '')}', true)">勾选当前目录</button>
      <button class="btn sm" onclick="clearPick()">清空（全部处理）</button>
      <span class="muted" style="font-size:12.5px">
        本层整棵子树：${d.node.subtree.dirs} 目录 · ${d.node.subtree.files} 文件
      </span>
    </div>
    ${SCOPE.dirty ? `<div class="note warn" style="margin-top:12px"><i>●</i><div>
      有改动还没保存 —— 点右上角「保存范围」。</div></div>` : ''}
    <div id="scopeEst" style="margin-top:13px"></div>`;
}

function clearPick() {
  SCOPE.includes = [];
  SCOPE.dirty = true;
  rerenderScope();
}

// 勾/取消一个目录（路径相对**同步根**）
function togglePick(rel, on) {
  if (!rel) { toast('这是同步根本身，不用勾'); return; }
  const r = String(rel).replace(/^\/+|\/+$/g, '');
  let incs = SCOPE.includes.filter(x => x !== r);
  if (on) incs.push(r);
  // ⚠️ 去掉被父级覆盖的子项（勾了 `a` 就不用再勾 `a/b`）——
  //    否则清单越来越长，而且试算数字会让人以为「勾了很多」。
  SCOPE.includes = incs.filter(x => !incs.some(y => y !== x && x.startsWith(y + '/')));
  SCOPE.dirty = true;
  rerenderScope();                 // ⛔ 不重新请求 —— 请求会把本地选择覆盖掉
}

async function saveScope() {
  const rootEl = $('#scopeRoot');
  const body = {
    remote_root: rootEl ? rootEl.value.trim() : SCOPE.remote_root,
    include_dirs: SCOPE.includes,
  };
  try {
    const d = await api('/api/scope', { method: 'POST', body: JSON.stringify(body) });
    SCOPE.remote_root = d.scope.remote_root;
    SCOPE.includes = d.scope.includes.slice();
    SCOPE.dirty = false;                       // 存过了 ⇒ 之后允许被服务端值覆盖
    await loadScope(SCOPE.path);
    renderScopeEstimate(d);
    toast(d.warn ? '已保存（有告警，见下）' : '已保存');
    loadState();
  } catch (e) {
    toast('保存失败：' + e.message);
  }
}

function renderScopeEstimate(d) {
  const box = $('#scopeEst');
  if (!box) return;
  const w = d.warn ? `<div class="note warn"><i>⚠</i><div>${esc(d.warn)}</div></div>` : '';
  const e = d.estimate || {};
  if (e.error) {
    box.innerHTML = w + `<div class="note bad"><i>⚠</i><div>${esc(e.error)}</div></div>`;
    return;
  }
    // 🔴 `counts` 在 `estimate` **里面**（见 web.py 的 `/api/scope` 返回：
    //    `{estimate:{remote_dirs, remote_files, local_strm, counts, sample}}`）。
    //    以前这里读的是顶层 `d.counts` ⇒ 取到 undefined ⇒
    //    「会写 strm」显示 **NaN**、「其中新增 / 会删」恒为 0 ——
    //    2026-10-08 无头自测时逮到的（页面不报错，数字看着还挺像那么回事）。
    const c = (e.counts) || {};
    const move = d.looks_like_move
      ? `<div class="note info"><i>🔀</i><div>这一批看着是<b>改名 / 移动</b>（消失的条数 ≈ 新增的条数）——
          不是异常。旧的会在<b>本轮复核后</b>一并清掉。</div></div>`
      : '';
    box.innerHTML = w + move + `<div class="note ok"><i>✓</i><div>
      <div>按这个范围试算（<b>没有动任何文件</b>）：</div>
    <div class="stats" style="margin-top:9px">
      <div class="stat pri"><div class="k">会写 strm</div><div class="v">${n(c.add + c.update)}</div></div>
      <div class="stat"><div class="k">其中新增</div><div class="v">${n(c.add)}</div></div>
      <div class="stat bad"><div class="k">会删</div><div class="v">${n(c.delete)}</div></div>
      <div class="stat"><div class="k">网盘条目</div><div class="v">${n(e.remote_files)}</div></div>
      <div class="stat"><div class="k">本地已有</div><div class="v">${n(e.local_strm)}</div></div>
    </div>
    ${(e.sample && e.sample.length) ? `<div style="margin-top:9px;font-size:12.5px;word-break:break-all">
      strm 内容样例：<span class="mono">${esc(decodeSafe(e.sample[0].url))}</span></div>` : ''}
  </div></div>`;
}

/* ---------------- 设置 ---------------- */
let FIELDS = [], SETUP_MISSING = [];
// 「有自己专属界面」的字段：不出现在普通表单里（否则两处都能改、谁说了算不清楚）
//   · remote_root / include_dirs —— 「同步范围」卡里的目录选择器
//   · strm_prefix              —— 「播放地址」卡（唯一必填项，单独给一张卡 + 自检按钮）
const OWN_UI = new Set(['remote_root', 'include_dirs', 'strm_prefix']);

async function loadSettings() {
  try {
    const d = await api('/api/settings');
    FIELDS = d.fields;
    SETUP_MISSING = d.missing || [];
    renderSettings(d);
    renderSetup(d);
    renderPush(d);
    setDirty(false);
  } catch (e) { $('#setBody').innerHTML = `<div class="note bad">${esc(e.message)}</div>`; }
}

/* 首次配置清单 —— 照**第一次配置的顺序**（A：账号 → 播放地址 → 同步范围 → 跑一轮）
   列，缺哪步点哪步。序号与三张卡的徽章（`.cno`）**是同一套编号**。
   ⚠️ 数据来源三处：账号 ← `/api/accounts`（`loadAcct` 填 `SETUP_ACCT_OK`）、
      有没有目录树 ← `SCOPE.tree_missing`、跑没跑过 ← `/api/state` 的 `run`。
   ⭐ 全部就绪时整张卡**自动收起** —— 配好了还杵在首页就是噪音。 */
let SETUP_ACCT_OK = null, SETUP_D = null;

/* 🔴 2026-10-09：第 3 步从「同步根 ↔ 播放地址 配对」**换成「同步范围」**。
   起因（翻代码确认）：前缀为空时 `health.scope_warn()` 返回的原话是
   「还没配置 strm 前缀。」—— 于是第 3 步的说明跟第 2 步**几乎一字不差**：
   同一条事实说两遍，而它真正想说的「跟*谁*配对」反而没说。
   现在配对告警改挂到第 3 步的说明里（有则优先显示），既不丢、也不再重复。
   ⭐ 第 4 步「跑第一轮」是**新增**的 —— 这一步原来界面上完全没提，
      可它才是拿到目录树的唯一途径。 */
function renderSetup(d) {
  if (d) SETUP_D = d;
  d = SETUP_D;
  if (!d) return;
  const by = {}; (d.fields || []).forEach(f => by[f.key] = f);
  const prefix = by.strm_prefix || {};
  const needPrefix = SETUP_MISSING.includes('strm_prefix');
  const treeOk = SCOPE.tree_missing === false;
  const st = window.__state || {};
  const ranBefore = !!(st.run && (st.run.result || st.run.finished));
  const incs = SCOPE.includes || [];
  const scopeSaved = `${SCOPE.remote_root || '（树根）'} / ${incs.length ? incs.join(' + ') : '全部目录'}`;
  const steps = [
    { n: 1, ok: SETUP_ACCT_OK === true, t: '115 账号', go: '去配 →',
      page: 'set', anchor: 'acctCard',
      hint: SETUP_ACCT_OK === null ? '检查中…'
        : (SETUP_ACCT_OK ? '已就绪 —— 工具用它去 115 导目录树'
                         : '还没配 —— 在本页「115 账号」里扫码登录或粘贴 cookie') },
    { n: 2, ok: !needPrefix, t: '播放地址（strm 内容前缀）', go: '去填 →',
      page: 'set', anchor: 'outCard', req: true,
      hint: needPrefix ? '唯一必填项 —— 空着**跑不了**（工具会在开跑前拦住你）'
                       : String(prefix.value || '') },
    // ⚠️ `ok` 必须**同时**要求「没有配对告警」—— 否则四步全齐时整张清单收起，
    //    配对告警会跟着一起消失（它正是挂在本步说明里的）。
